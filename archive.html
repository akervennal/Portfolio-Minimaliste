<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armel Kervennal — archive</title>
    <meta
      name="description"
      content="Archive complète des photographies d'Armel Kervennal, classée par année et par lieu."
    />
    <link rel="icon" type="image/png" href="Favicon/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- set synchronously so the pre-paint state matches what JS will draw -->
    <script>
      document.documentElement.className = "js";
    </script>

    <style>
      :root {
        --sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
        --ink: #111;
        --muted: rgba(17, 17, 17, 0.55);
        --line: rgba(17, 17, 17, 0.12);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --hdr-h: 72px;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: #fff;
      }

      body {
        font-family: var(--sans);
        font-weight: 400;
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* the cover grid breaks out to full viewport width (below); this
           keeps that trick from opening a horizontal scrollbar */
        overflow-x: hidden;
      }

      a {
        color: inherit;
      }

      /* ============================================================
         HEADER
         ============================================================ */
      .hdr {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 26px 32px;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.01em;
        /* no background: the soft halo vanishes on white and keeps the
           header readable when a photo scrolls underneath */
        --hdr-halo: drop-shadow(0 0 5px rgba(255, 255, 255, 0.85));
        transition:
          transform 0.5s var(--ease),
          color 0.25s linear;
      }
      .hdr.is-hidden {
        transform: translateY(-140%);
      }
      .hdr > a,
      .hdr > button,
      .menu {
        filter: var(--hdr-halo);
      }
      .hdr a {
        text-decoration: none;
      }
      .hdr a:hover {
        opacity: 0.55;
      }

      /* Persistent minimal reminder of where you are (year / location),
         sticky just under the fixed header so it stays visible while
         scrolling a long grid. */
      .crumb {
        position: sticky;
        top: var(--hdr-h);
        z-index: 40;
        display: none;
        align-items: baseline;
        gap: 10px;
        padding: 14px 32px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .crumb.on {
        display: flex;
      }
      .crumb a {
        text-decoration: none;
        color: var(--muted);
      }
      .crumb a:hover {
        color: var(--ink);
      }
      .crumb .sep {
        opacity: 0.5;
      }
      .crumb .here {
        color: var(--ink);
      }

      .page {
        --locs-gap: 13px;
        max-width: 1100px;
        margin: 0 auto;
        padding: calc(var(--hdr-h) + 6vh) 32px 14vh;
      }

      /* ============================================================
         REVEAL — fade the active view in on load / on navigation
         ============================================================ */
      .reveal {
        transition:
          opacity 0.5s var(--ease),
          transform 0.5s var(--ease);
      }
      .js .reveal {
        opacity: 0;
        transform: translateY(10px);
      }
      .reveal.in {
        opacity: 1;
        transform: none;
      }

      /* When a same-document navigation goes through the View
         Transitions API (below), that API already crossfades the whole
         view on its own — skip the hidden-start fade above on top of
         it, or the two compete: the transition crossfades to a still-
         invisible frame, then the reveal fades it in a second time,
         which reads as a flicker/flash. Browsers without View
         Transition support never set this class, so they keep the
         plain fade above as their only transition. */
      .vt-nav .reveal {
        opacity: 1;
        transform: none;
      }

      /* Same-document navigation (year → location → grid) crossfades
         via the View Transitions API, matching the cross-document
         crossfade already used between index/about/archive. */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.4s;
        animation-timing-function: var(--ease);
      }

      /* ============================================================
         YEARS — level 1
         ============================================================ */

      /* ============================================================
         ARCHIVE HOME — every year, each with its own cover grid
         ============================================================ */
      .yr-section {
        margin-bottom: 88px;
      }
      .yr-section:last-child {
        margin-bottom: 0;
      }
      /* ============================================================
         LOCATIONS — cover grid, six across, edge to edge of the
         viewport (breaks out of .page's max-width/padding on purpose)
         ============================================================ */
      .locs {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: var(--locs-gap);
        width: 100vw;
        padding: 0 var(--locs-gap);
        position: relative;
        left: 50%;
        right: 50%;
        margin-left: -50vw;
        margin-right: -50vw;
      }
      .loc {
        display: block;
        text-decoration: none;
        color: inherit;
      }
      .loc-cover {
        aspect-ratio: 3 / 2;
        overflow: hidden;
        background: #f2f2f2;
      }
      .loc-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition:
          clip-path 0.7s var(--ease),
          opacity 0.5s var(--ease);
      }
      .loc-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
      }
      .loc-name {
        font-size: 14px;
        font-weight: 500;
      }
      .loc-count {
        font-size: 11px;
        color: var(--muted);
      }

      .js .loc-cover img {
        clip-path: inset(100% 0 0 0);
        opacity: 0;
      }
      .loc-cover img.loaded {
        clip-path: inset(0 0 0 0);
        opacity: 1;
      }

      .empty {
        color: var(--muted);
        padding: 40px 0;
      }

      @media (max-width: 700px) {
        :root {
          --hdr-h: 58px;
        }
        .hdr {
          padding: 20px 20px;
          font-size: 15px;
        }
        .crumb {
          padding: 12px 20px;
        }
        .page {
          padding: calc(var(--hdr-h) + 5vh) 20px 12vh;
        }
        .locs {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hdr,
        .reveal,
        .loc,
        .loc-cover img {
          transition: none;
        }
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
      }
    </style>
    <link rel="stylesheet" href="menu.css" />
    <link rel="stylesheet" href="gallery.css" />
  </head>

  <body>
    <header class="hdr" id="hdr">
      <a href="index.html">Armel Kervennal</a>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
      <nav class="menu" id="menu">
        <a href="archive.html" class="is-current" id="archiveHome">archive</a>
        <a href="auto.html">auto</a>
        <a href="about.html">about</a>
      </nav>
    </header>
    <div class="menu-scrim" id="menuScrim" hidden></div>

    <div class="crumb" id="crumb"></div>

    <main class="page">
      <div id="view"></div>
    </main>

    <div class="lb" id="lb">
      <button class="lb-close" id="lbClose">fermer · esc</button>
      <button class="lb-nav prev" id="lbPrev" aria-label="Photo précédente"></button>
      <div class="lb-stage" id="lbStage"></div>
      <button class="lb-nav next" id="lbNext" aria-label="Photo suivante"></button>
      <div class="lb-counter" id="lbCounter"></div>
    </div>

    <script src="site-config.js"></script>
    <script src="menu.js"></script>
    <script src="gallery.js"></script>
    <script>
      function resolveSrc(p) {
        return p;
      }

      const projects = (window.SITE_CONFIG && SITE_CONFIG.projects) || {};

      // ============================================================
      // Group projects by year only — each project stays its own tile
      // (by title), never merged with another project even when they
      // share a location. Order within a year keeps the config's own
      // order (roughly newest-shoot-first) rather than re-deriving one
      // from the free-text date field.
      // ============================================================
      function buildIndex() {
        const years = {};
        const yearOrder = [];

        Object.keys(projects).forEach((id) => {
          const p = projects[id];
          const y = p.year || "—";

          if (!years[y]) {
            years[y] = { order: [] };
            yearOrder.push(y);
          }
          years[y].order.push(id);
        });

        yearOrder.sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
        return { years, yearOrder };
      }

      const INDEX = buildIndex();

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      // ============================================================
      // ROUTING — ?y=<year>&p=<project id>, back/forward friendly
      // ============================================================
      function paramsFromURL() {
        const sp = new URLSearchParams(location.search);
        return { y: sp.get("y"), p: sp.get("p") };
      }

      // Same-document crossfade between archive states, when the
      // browser supports it; falls straight back to a plain render.
      // "vt-nav" tells the reveal CSS above to stand down for the
      // duration — see the comment there for why.
      function renderTransitioned() {
        if (document.startViewTransition) {
          document.documentElement.classList.add("vt-nav");
          const transition = document.startViewTransition(render);
          // .finished rejects if a rapid second navigation skips this
          // transition before it settles — expected, not an error.
          transition.finished.catch(() => {}).finally(() => {
            document.documentElement.classList.remove("vt-nav");
          });
        } else {
          render();
        }
      }

      function navigate(y, pid) {
        const sp = new URLSearchParams();
        if (y) sp.set("y", y);
        if (y && pid) sp.set("p", pid);
        const qs = sp.toString();
        history.pushState({}, "", qs ? "archive.html?" + qs : "archive.html");
        renderTransitioned();
      }

      window.addEventListener("popstate", renderTransitioned);

      // ============================================================
      // CRUMB — the persistent "where you are" reminder
      // ============================================================
      const crumbEl = document.getElementById("crumb");

      function renderCrumb(y, pid) {
        crumbEl.innerHTML = "";
        // The picture grid (y + p) gets its own big in-flow heading
        // instead (built in gridView, styled like the year on the
        // cover grid) — this small sticky bar is only for the
        // year-only view.
        if (!y || pid) {
          crumbEl.classList.remove("on");
          return;
        }
        crumbEl.classList.add("on");
        const yLink = el("a", null, y);
        yLink.href = "archive.html?y=" + encodeURIComponent(y);
        yLink.addEventListener("click", (e) => {
          e.preventDefault();
          navigate(y, null);
        });
        crumbEl.appendChild(yLink);
      }

      // ============================================================
      // VIEWS
      // ============================================================
      const viewEl = document.getElementById("view");

      function mountReveal(node) {
        viewEl.innerHTML = "";
        node.classList.add("reveal");
        viewEl.appendChild(node);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => node.classList.add("in"));
        });
      }

      // A year's cover grid — one tile per PROJECT (never merged, even
      // when two projects share a location), used both inline on the
      // archive home (every year at once) and on the focused
      // single-year view reached from the breadcrumb's "back" link.
      function buildProjectsGrid(y) {
        const yr = INDEX.years[y];
        const grid = el("div", "locs");
        yr.order.forEach((pid) => {
          const proj = projects[pid];
          const title = proj.title || pid;
          const photos = proj.photos || [];
          const coverSrc = proj.cover || photos[0];

          const a = el("a", "loc", null);
          a.href = "archive.html?y=" + encodeURIComponent(y) + "&p=" + encodeURIComponent(pid);
          const cover = el("div", "loc-cover");
          if (coverSrc) {
            const img = document.createElement("img");
            revealOnLoad(img);
            img.src = resolveSrc(coverSrc);
            img.alt = title;
            img.loading = "lazy";
            img.decoding = "async";
            cover.appendChild(img);
          }
          a.appendChild(cover);
          const meta = el("div", "loc-meta");
          meta.appendChild(el("span", "loc-name", title));
          meta.appendChild(el("span", "loc-count", String(photos.length)));
          a.appendChild(meta);
          a.addEventListener("click", (e) => {
            e.preventDefault();
            navigate(y, pid);
          });
          revealItem(a);
          grid.appendChild(a);
        });
        return grid;
      }

      // Archive home — every year, each with its own cover grid right
      // underneath, so the whole archive is browsable without a click.
      function archiveHomeView() {
        const wrap = el("div");
        if (!INDEX.yearOrder.length) {
          wrap.appendChild(el("p", "empty", "Aucune photo dans l'archive pour l'instant."));
          mountReveal(wrap);
          return;
        }
        INDEX.yearOrder.forEach((y) => {
          const section = el("section", "yr-section");
          const projCount = INDEX.years[y].order.length;

          const head = el("div", "yr-head", null);
          head.appendChild(el("span", "yr-y", y));
          head.appendChild(el("span", "yr-meta", String(projCount)));
          revealItem(head);
          section.appendChild(head);

          section.appendChild(buildProjectsGrid(y));
          wrap.appendChild(section);
        });
        mountReveal(wrap);
      }

      function yearView(y) {
        const yr = INDEX.years[y];
        const wrap = el("div");
        if (!yr) {
          wrap.appendChild(el("p", "empty", "Année introuvable."));
          mountReveal(wrap);
          return;
        }
        wrap.appendChild(buildProjectsGrid(y));
        mountReveal(wrap);
      }

      function gridView(y, pid) {
        const yr = INDEX.years[y];
        const proj = yr && projects[pid];
        const wrap = el("div");
        if (!proj) {
          wrap.appendChild(el("p", "empty", "Projet introuvable."));
          mountReveal(wrap);
          return;
        }
        const title = proj.title || pid;
        const photos = proj.photos || [];

        const head = el("a", "yr-head", null);
        head.href = "archive.html";
        head.appendChild(el("span", "yr-y", title));
        head.appendChild(el("span", "yr-meta", String(photos.length)));
        head.addEventListener("click", (e) => {
          e.preventDefault();
          navigate(null, null);
        });
        wrap.appendChild(head);

        wrap.appendChild(buildPhotoGrid(photos, title));
        mountReveal(wrap);
      }

      function render() {
        const { y, p } = paramsFromURL();
        renderCrumb(y, p);
        if (y && p) gridView(y, p);
        else if (y) yearView(y);
        else archiveHomeView();
      }

      // ============================================================
      // HEADER HIDE ON SCROLL — same behaviour as the other pages
      // ============================================================
      const hdr = document.getElementById("hdr");
      let lastY = window.pageYOffset;
      let hidden = false;
      window.addEventListener(
        "scroll",
        () => {
          const y = window.pageYOffset;
          const dy = y - lastY;
          if (Math.abs(dy) <= 6) return;
          if (dy > 0 && y > 80 && !hidden) {
            hidden = true;
            hdr.classList.add("is-hidden");
          } else if (dy < 0 && hidden) {
            hidden = false;
            hdr.classList.remove("is-hidden");
          }
          lastY = y;
        },
        { passive: true },
      );

      document.getElementById("archiveHome").addEventListener("click", (e) => {
        if (!paramsFromURL().y) return; // already home, let it just navigate normally
        e.preventDefault();
        navigate(null, null);
      });

      render();
    </script>
  </body>
</html>
