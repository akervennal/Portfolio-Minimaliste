<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armel Kervennal — à propos</title>
    <meta
      name="description"
      content="À propos d'Armel Kervennal, photographe basé à Nantes."
    />
    <link rel="icon" type="image/png" href="Favicon/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- set synchronously so the pre-paint state matches what JS will draw -->
    <script>
      document.documentElement.className = "js";
    </script>

    <style>
      :root {
        --sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
        --fg: #111;
        --halo: rgba(255, 255, 255, 0.85);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --pad: 32px;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: #fff;
      }

      body {
        font-family: var(--sans);
        font-weight: 400;
        font-size: 15px;
        line-height: 1.6;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      a {
        color: inherit;
      }

      .hdr {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 26px var(--pad);
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--fg);
      }
      /* keeps the header readable when a photo scrolls underneath it */
      .hdr > a,
      .hdr > button {
        filter: drop-shadow(0 0 5px var(--halo));
      }
      .hdr a {
        text-decoration: none;
      }
      .hdr a:hover {
        opacity: 0.55;
      }

      .label {
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.6;
      }

      /* ============================================================
         STORY — a cycle per scene, driven by the scroll: the photo sits
         alone on its colour like on the homepage, the text comes up over
         it while it blurs away into that colour, the text leaves, and
         the next colour and photo arrive together. The text scrolls with
         the page; only the photos and the colour are computed. Its
         spacing (--cycle) and the JS timings below go together.
         ============================================================ */
      .story {
        --cycle: 140svh;
        display: grid;
      }
      .stage {
        grid-area: 1 / 1;
        position: sticky;
        top: 64px;
        height: calc(100svh - 64px);
      }
      .stage img {
        position: absolute;
        inset: 0;
        margin: auto;
        max-width: 92vw;
        max-height: 72vh;
        width: auto;
        height: auto;
        opacity: 0;
        will-change: opacity, filter;
      }
      .scenes {
        grid-area: 1 / 1;
        position: relative;
        padding-top: calc(100svh + 8px);
      }
      .scene {
        height: var(--cycle);
        padding: 0 var(--pad);
      }
      .scene:last-child {
        height: calc(var(--cycle) * 0.85);
      }
      .scene p {
        max-width: 15em;
        margin: 0 auto;
        font-size: clamp(34px, 5vw, 80px);
        font-weight: 500;
        line-height: 1.06;
        letter-spacing: -0.03em;
        text-align: center;
      }

      /* ============================================================
         QUOTE, EQUIPMENT, CONTACT
         ============================================================ */
      .quote {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        min-height: 110svh;
        padding: 0 var(--pad);
      }
      .quote p {
        max-width: 15em;
        font-size: clamp(38px, 6.6vw, 112px);
        font-weight: 500;
        line-height: 1.02;
        letter-spacing: -0.03em;
      }
      .kit {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 9vh;
        min-height: 100svh;
        padding: 14vh var(--pad);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .stat b {
        display: block;
        font-size: clamp(46px, 9vw, 150px);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .gear-row {
        display: grid;
        grid-template-columns: 1fr 3fr;
        align-items: baseline;
        gap: 16px;
        padding: 14px 0;
        border-top: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
      }
      .gear-row:last-child {
        border-bottom: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
      }
      .gear-title {
        font-size: clamp(20px, 2.4vw, 34px);
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .gear-title + .gear-title {
        margin-top: 4px;
      }
      .contact {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 34px;
        min-height: 100svh;
        padding: 12vh var(--pad);
      }
      .contact-note {
        max-width: 26em;
        font-size: clamp(20px, 2.4vw, 34px);
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .mail {
        display: block;
        width: max-content;
        font-size: 80px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.04em;
        text-decoration: none;
        white-space: nowrap;
      }
      .mail:hover {
        opacity: 0.6;
      }
      .contact-more {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 10px 32px;
        font-size: 17px;
        font-weight: 500;
      }
      .contact-more a {
        text-underline-offset: 4px;
      }
      .copy {
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 4px;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .quote {
          min-height: 80svh;
        }
        .kit {
          gap: 40px;
          min-height: 0;
          padding: 12vh var(--pad);
        }
        .stats {
          gap: 10px;
        }
        .gear-row {
          grid-template-columns: 1fr;
          gap: 4px;
        }
        .contact {
          min-height: 62svh;
          gap: 16px;
          padding: 40px var(--pad);
        }
        .contact-note {
          font-size: 17px;
        }
      }

      @media (max-width: 700px) {
        :root {
          --pad: 20px;
        }
        .hdr {
          font-size: 15px;
        }

        /* ============================================================
           PHONE — the same cycle, one screen per scene: the photo runs
           edge to edge and melts into the colour, the sentence sits on
           that colour, and each scroll stops on the next sentence. The
           contact comes straight after the story.
           ============================================================ */
        /* Mandatory: with proximity, a short swipe on iOS stops halfway
           between two scenes. So every block needs a stop of its own. */
        html {
          scroll-snap-type: y mandatory;
        }
        #about {
          display: flex;
          flex-direction: column;
        }
        .story {
          order: 1;
        }
        .contact {
          order: 2;
          scroll-snap-align: start;
        }
        .kit {
          order: 3;
          scroll-snap-align: start;
        }
        .quote {
          order: 4;
          scroll-snap-align: start;
        }
        /* Below the top edge, like the header in menu.css: iOS Safari
           paints the status bar solid over anything fixed against it. The
           photo melts into the colour there too, so no hard line shows
           under the clock. */
        .stage {
          top: 20px;
          height: calc(100svh - 20px);
          overflow: hidden;
        }
        .stage img {
          inset: 0 0 auto;
          margin: 0;
          width: 100%;
          height: calc(82svh - 20px);
          max-width: none;
          max-height: none;
          object-fit: cover;
          mask-image: linear-gradient(transparent, #000 10%, #000 58%, transparent);
        }
        .scenes {
          padding-top: 0;
        }
        .scene,
        .scene:last-child {
          position: relative;
          height: 100svh;
          scroll-snap-align: start;
          scroll-snap-stop: always;
        }
        .scene p {
          position: absolute;
          left: var(--pad);
          right: var(--pad);
          bottom: 44px;
          max-width: none;
          margin: 0;
          font-size: 34px;
          text-align: left;
          transition: color 0.25s linear;
        }
      }

      /* ============================================================
         PAGE TRANSITIONS
         ============================================================ */
      @view-transition {
        navigation: auto;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.5s;
        animation-timing-function: var(--ease);
      }

      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
      }
    </style>
    <link rel="stylesheet" href="menu.css" />
  </head>

  <body data-page="about">
    <header class="hdr" id="hdr">
      <a href="index.html">Armel Kervennal</a>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
      <nav class="menu" id="menu" hidden>
        <a href="archive.html">archive</a>
        <a href="auto.html">automobile</a>
        <a href="about.html" class="is-current">about</a>
      </nav>
    </header>
    <div class="menu-scrim" id="menuScrim" hidden></div>

    <main id="about"></main>

    <script src="site-config.js"></script>
    <script src="menu.js"></script>
    <script src="colour.js"></script>
    <script>
      const site = window.SITE_CONFIG || {};
      const about = (site.content || {}).about || {};
      const contact = (site.content || {}).contact || {};
      const labels = (site.site || {}).labels || {};
      const story = about.story || [];
      const root = document.getElementById("about");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
      const phone = matchMedia("(max-width: 700px)");

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      // --- story ------------------------------------------------------
      const stage = el("div", "stage");
      const scenes = el("div", "scenes");
      const sections = []; // every block after the story, each with its colour
      const cycles = story.map((scene) => {
        const sec = el("section", "scene");
        const text = el("p", null, scene.text);
        sec.appendChild(text);
        scenes.appendChild(sec);
        const img = el("img");
        img.alt = "";
        if (scene.photo) img.src = scene.photo;
        stage.appendChild(img);
        return { text, img, lab: hexToOklab(scene.color || "#ffffff") };
      });

      const storyEl = el("div", "story");
      storyEl.append(stage, scenes);
      root.appendChild(storyEl);

      // --- quote ------------------------------------------------------
      if (about.quote) {
        const q = el("figure", "quote");
        q.appendChild(el("p", null, "« " + about.quote + " »"));
        if (about.quoteAuthor) q.appendChild(el("figcaption", "label", about.quoteAuthor));
        root.appendChild(q);
        sections.push({ el: q, color: about.quoteColor });
      }

      // --- figures and equipment --------------------------------------
      const kit = el("section", "kit");
      const stats = el("div", "stats");
      function stat(value, label) {
        const s = el("div", "stat");
        s.append(el("b", null, value), el("span", "label", label));
        stats.appendChild(s);
      }
      // Counted from the albums, so these stay true by themselves.
      const albums = Object.values(site.projects || {});
      const photos = new Set(albums.flatMap((a) => a.photos || []));
      if (about.since) stat(about.since, labels.since || "depuis");
      stat(String(photos.size), labels.photos || "photos");
      stat(String(albums.length), labels.albums || "albums");
      kit.appendChild(stats);

      const gear = el("div");
      let lastLabel = null;
      let item = null;
      (about.gear || []).forEach((g) => {
        if (!item || g.label !== lastLabel) {
          item = el("div");
          const row = el("div", "gear-row");
          row.append(el("span", "label", g.label), item);
          gear.appendChild(row);
          lastLabel = g.label;
        }
        item.appendChild(el("div", "gear-title", g.title));
      });
      kit.appendChild(gear);
      root.appendChild(kit);
      sections.push({ el: kit, color: about.gearColor });

      // --- contact ----------------------------------------------------
      const cs = el("section", "contact");
      if (contact.note) cs.appendChild(el("p", "contact-note", contact.note));
      const mail = el("a", "mail", contact.email);
      mail.href = "mailto:" + contact.email;
      cs.appendChild(mail);

      const more = el("div", "contact-more");
      const copy = el("button", "copy", labels.copy || "copier");
      copy.type = "button";
      copy.addEventListener("click", async () => {
        await navigator.clipboard.writeText(contact.email);
        copy.textContent = labels.copied || "copié";
        setTimeout(() => (copy.textContent = labels.copy || "copier"), 1800);
      });
      more.appendChild(copy);
      if (contact.instagramHandle) {
        const a = el("a", null, contact.instagramHandle);
        a.href = contact.instagramUrl || "#";
        a.target = "_blank";
        a.rel = "noopener";
        more.appendChild(a);
      }
      if (contact.location) more.appendChild(el("span", null, contact.location));
      cs.appendChild(more);
      root.appendChild(cs);
      sections.push({ el: cs, color: about.contactColor });

      // The address fills the width, whatever its length.
      function fitMail() {
        const room = cs.clientWidth - 2 * parseFloat(getComputedStyle(cs).paddingLeft);
        mail.style.fontSize = "100px";
        const size = (100 * room) / mail.offsetWidth;
        mail.style.fontSize = Math.min(size, 190) + "px";
      }
      fitMail();
      document.fonts.ready.then(fitMail);
      window.addEventListener("resize", fitMail);

      // --- colour: same treatment as the homepage ---------------------
      // The block at the centre of the screen sets a target, and the
      // colour eases toward it in OKLab at its own pace.
      const EASE = 0.085; // lerp factor per 60fps frame
      const FRAME_MS = 1000 / 60;
      const SETTLED = 0.0015;
      let curLab = null;
      let targetLab = null;
      let painting = false;
      let lastPaint = 0;
      let paintedCss = null;
      let paintedDark = null;

      function applyColour() {
        const css = oklabToCss(curLab);
        if (css === paintedCss) return;
        paintedCss = css;
        document.documentElement.style.backgroundColor = css;
        document.body.style.backgroundColor = css;
        const dark = curLab[0] < 0.62;
        if (dark === paintedDark) return;
        paintedDark = dark;
        document.documentElement.style.setProperty("--fg", dark ? "#f2f2f2" : "#111111");
        document.documentElement.style.setProperty("--halo", dark ? "rgba(0, 0, 0, 0.6)" : "rgba(255, 255, 255, 0.85)");
      }

      function paint() {
        painting = false;
        const now = performance.now();
        const frames = Math.min(now - lastPaint, 100) / FRAME_MS;
        lastPaint = now;
        const ease = reduceMotion.matches ? 1 : 1 - Math.pow(1 - EASE, frames);

        let rest = 0;
        curLab = curLab.map((v, k) => {
          const nv = v + (targetLab[k] - v) * ease;
          rest = Math.max(rest, Math.abs(targetLab[k] - nv));
          return nv;
        });
        if (rest < SETTLED) curLab = targetLab;

        applyColour();

        if (curLab !== targetLab) {
          painting = true;
          requestAnimationFrame(paint);
        }
      }

      // The story follows the finger, with no easing of its own.
      function snapColour(lab) {
        curLab = targetLab = lab;
        applyColour();
      }

      function setColour(hex) {
        const lab = hexToOklab(hex || "#ffffff");
        if (targetLab && lab.every((v, k) => v === targetLab[k])) return;
        targetLab = lab;
        if (!curLab) curLab = lab;
        if (!painting) {
          painting = true;
          lastPaint = performance.now();
          requestAnimationFrame(paint);
        }
      }

      // --- scroll -----------------------------------------------------
      // Each scene's clock: 0 starts its cycle, 0.5 has the text centred,
      // 1 is the start of the next one. At the top of the page the first
      // scene is already at PHOTO_HOLDS, with its text showing at the
      // bottom of the screen to say there is more.
      const PHOTO_HOLDS = 0.17; // the photo starts to go as the text arrives
      const PHOTO_GONE = 0.45; // just before the text reaches the centre
      const NEXT_STARTS = 0.48;
      const NEXT_ARRIVED = 0.8;
      const MAX_BLUR = 26;

      function smooth(from, to, t) {
        const x = Math.max(0, Math.min(1, (t - from) / (to - from)));
        return x * x * (3 - 2 * x);
      }

      function setPhoto(cycle, shown) {
        cycle.img.style.opacity = shown;
        cycle.img.style.filter = shown > 0 && shown < 1 ? "blur(" + (1 - shown) * MAX_BLUR + "px)" : "none";
      }

      function runCycles() {
        if (!cycles.length) return false;
        if (phone.matches) return runPhoneCycles();
        const middle = window.innerHeight / 2;
        const spacing = cycles.length > 1 ? cycles[1].text.offsetTop - cycles[0].text.offsetTop : window.innerHeight * 1.7;
        const first = cycles[0].text.getBoundingClientRect();
        // Scenes elapsed: a text is centred when this is its index + 0.5.
        const clock = 0.5 + (middle - (first.top + first.height / 2)) / spacing;
        const index = Math.max(0, Math.floor(clock));
        const t = clock - index;
        const inStory = index < cycles.length;

        cycles.forEach((cycle, i) => {
          let shown = 0;
          if (i === index) shown = 1 - smooth(PHOTO_HOLDS, PHOTO_GONE, t);
          else if (i === index + 1) shown = smooth(NEXT_STARTS, NEXT_ARRIVED, t);
          setPhoto(cycle, shown);
          // Gone before it reaches the header, or the two would overlap.
          cycle.text.style.opacity = Math.max(0, Math.min(1, (cycle.text.getBoundingClientRect().top - 60) / 70));
        });

        if (inStory) {
          const from = cycles[index].lab;
          const next = cycles[index + 1] ? cycles[index + 1].lab : hexToOklab(sections[0]?.color || "#ffffff");
          const mix = smooth(NEXT_STARTS, NEXT_ARRIVED, t);
          snapColour(from.map((v, k) => v + (next[k] - v) * mix));
        }
        return inStory;
      }

      // Same timings, but a scene's clock starts with its sentence at rest
      // and the last photo stays until the story scrolls away.
      function runPhoneCycles() {
        const height = window.innerHeight;
        const last = cycles.length - 1;
        const clock = -scenes.getBoundingClientRect().top / scenes.firstChild.offsetHeight;
        const held = Math.max(0, Math.min(clock, last));
        const index = Math.floor(held);
        const t = held - index;
        const from = cycles[index];
        const next = cycles[index + 1];

        cycles.forEach((cycle, i) => {
          let shown = 0;
          if (cycle === from) shown = next ? 1 - smooth(PHOTO_HOLDS, PHOTO_GONE, t) : 1;
          else if (cycle === next) shown = smooth(NEXT_STARTS, NEXT_ARRIVED, t);
          setPhoto(cycle, shown);
          // Gone before it climbs onto the sharp part of the next photo.
          const top = cycle.text.getBoundingClientRect().top;
          cycle.text.style.opacity = Math.max(0, Math.min(1, (top - height * 0.3) / (height * 0.25)));
        });

        if (clock > last) return false;
        const mix = smooth(NEXT_STARTS, NEXT_ARRIVED, t);
        snapColour(from.lab.map((v, k) => v + ((next || from).lab[k] - v) * mix));
        return true;
      }

      function onScroll() {
        scrollQueued = false;
        if (runCycles()) return;
        const middle = window.innerHeight / 2;
        const active = sections.find(({ el: s }) => {
          const r = s.getBoundingClientRect();
          return r.top <= middle && r.bottom > middle;
        });
        if (active) setColour(active.color);
      }

      let scrollQueued = false;
      function queueScroll() {
        if (scrollQueued) return;
        scrollQueued = true;
        requestAnimationFrame(onScroll);
      }
      window.addEventListener("scroll", queueScroll, { passive: true });
      window.addEventListener("resize", queueScroll);
      // Each photo that loads pushes the page down: "load" doesn't bubble,
      // hence the capture.
      root.addEventListener("load", queueScroll, true);
      onScroll();
    </script>
  </body>
</html>
