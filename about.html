<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armel Kervennal — à propos</title>
    <meta
      name="description"
      content="À propos d'Armel Kervennal, photographe basé à Nantes."
    />
    <link rel="icon" type="image/png" href="Favicon/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- set synchronously so the pre-paint state matches what JS will draw -->
    <script>
      document.documentElement.className = "js";
    </script>

    <style>
      :root {
        --sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
        --fg: #111;
        --halo: rgba(255, 255, 255, 0.85);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --pad: 32px;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: #fff;
      }

      body {
        font-family: var(--sans);
        font-weight: 400;
        font-size: 15px;
        line-height: 1.6;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      a {
        color: inherit;
      }

      .hdr {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 26px var(--pad);
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--fg);
      }
      /* keeps the header readable when a photo scrolls underneath it */
      .hdr > a,
      .hdr > button {
        filter: drop-shadow(0 0 5px var(--halo));
      }
      .hdr a {
        text-decoration: none;
      }
      .hdr a:hover {
        opacity: 0.55;
      }

      .label {
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.6;
      }

      /* ============================================================
         STORY — the text scrolls on the left while the photo holds on
         the right. Each scene names its photo: as long as it doesn't
         change the photo stays. The phone has its own version, below.
         ============================================================ */
      .story {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .stage {
        grid-column: 2;
        grid-row: 1;
        position: sticky;
        top: 0;
        height: 100svh;
        padding: 84px var(--pad) 32px;
      }
      .stage img {
        position: absolute;
        inset: 84px var(--pad) 32px;
        width: calc(100% - var(--pad) * 2);
        height: calc(100% - 116px);
        object-fit: contain;
        opacity: 0;
        transition: opacity 1.4s var(--ease);
      }
      .stage img.on {
        opacity: 1;
      }
      .scenes {
        grid-column: 1;
        grid-row: 1;
      }
      .scene {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 120svh;
        padding: 0 var(--pad);
      }
      .scene:first-child {
        min-height: 100svh;
      }
      .scene p {
        max-width: 19em;
        font-size: clamp(26px, 2.9vw, 46px);
        font-weight: 500;
        line-height: 1.16;
        letter-spacing: -0.02em;
      }
      .scene p.short {
        font-size: clamp(38px, 4.8vw, 76px);
        line-height: 1.04;
        letter-spacing: -0.03em;
      }
      .w {
        opacity: 0.16;
      }

      /* ============================================================
         QUOTE, EQUIPMENT, CONTACT
         ============================================================ */
      .quote {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        min-height: 110svh;
        padding: 0 var(--pad);
      }
      .quote p {
        max-width: 15em;
        font-size: clamp(38px, 6.6vw, 112px);
        font-weight: 500;
        line-height: 1.02;
        letter-spacing: -0.03em;
      }
      .kit {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 9vh;
        min-height: 100svh;
        padding: 14vh var(--pad);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .stat b {
        display: block;
        font-size: clamp(46px, 9vw, 150px);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .gear-row {
        display: grid;
        grid-template-columns: 1fr 3fr;
        align-items: baseline;
        gap: 16px;
        padding: 14px 0;
        border-top: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
      }
      .gear-row:last-child {
        border-bottom: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
      }
      .gear-title {
        font-size: clamp(20px, 2.4vw, 34px);
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .gear-title + .gear-title {
        margin-top: 4px;
      }
      .contact {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 34px;
        min-height: 100svh;
        padding: 12vh var(--pad);
      }
      .contact-note {
        max-width: 26em;
        font-size: clamp(20px, 2.4vw, 34px);
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .mail {
        display: block;
        width: max-content;
        font-size: 80px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.04em;
        text-decoration: none;
        white-space: nowrap;
      }
      .mail:hover {
        opacity: 0.6;
      }
      .contact-more {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 10px 32px;
        font-size: 17px;
        font-weight: 500;
      }
      .contact-more a {
        text-underline-offset: 4px;
      }
      .copy {
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 4px;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .quote {
          min-height: 80svh;
        }
        .kit {
          gap: 40px;
          min-height: 0;
          padding: 12vh var(--pad);
        }
        .stats {
          gap: 10px;
        }
        .gear-row {
          grid-template-columns: 1fr;
          gap: 4px;
        }
        .contact {
          min-height: 62svh;
          gap: 16px;
          padding: 40px var(--pad);
        }
        .contact-note {
          font-size: 17px;
        }
      }

      @media (max-width: 700px) {
        :root {
          --pad: 20px;
        }
        .hdr {
          font-size: 15px;
        }

        /* ============================================================
           PHONE — the same cycle, one screen per scene: the photo runs
           edge to edge and melts into the colour, the sentence sits on
           that colour, and each scroll stops on the next sentence. The
           contact comes straight after the story.
           ============================================================ */
        /* Mandatory: with proximity, a short swipe on iOS stops halfway
           between two scenes. So every block needs a stop of its own. */
        html {
          scroll-snap-type: y mandatory;
        }
        #about {
          display: flex;
          flex-direction: column;
        }
        .story {
          order: 1;
          grid-template-columns: 1fr;
        }
        .contact {
          order: 2;
          scroll-snap-align: start;
        }
        .kit {
          order: 3;
          scroll-snap-align: start;
        }
        .quote {
          order: 4;
          scroll-snap-align: start;
        }
        /* Below the top edge, like the header in menu.css: iOS Safari
           paints the status bar solid over anything fixed against it. The
           photos reach past that edge, to carry on behind the clock. */
        .stage {
          grid-column: 1;
          top: 20px;
          height: calc(100svh - 20px);
          padding: 0;
        }
        .stage img {
          inset: -100px 0 auto;
          width: 100%;
          height: calc(82svh + 80px);
          object-fit: cover;
          mask-image: linear-gradient(#000 calc(100% - 34svh), transparent);
          transition: none;
          will-change: opacity, filter;
        }
        .scene,
        .scene:first-child {
          position: relative;
          display: block;
          height: 100svh;
          min-height: 0;
          padding: 0;
          scroll-snap-align: start;
          scroll-snap-stop: always;
        }
        .scene p,
        .scene p.short {
          position: absolute;
          left: var(--pad);
          right: var(--pad);
          bottom: 44px;
          max-width: none;
          font-size: 34px;
          line-height: 1.06;
          letter-spacing: -0.03em;
          transition: color 0.25s linear;
        }
        .w {
          opacity: 1 !important;
        }
      }

      /* ============================================================
         PAGE TRANSITIONS
         ============================================================ */
      @view-transition {
        navigation: auto;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.5s;
        animation-timing-function: var(--ease);
      }

      @media (prefers-reduced-motion: reduce) {
        .stage img {
          transition: none;
        }
        .w {
          opacity: 1;
        }
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
      }
    </style>
    <link rel="stylesheet" href="menu.css" />
  </head>

  <body data-page="about">
    <header class="hdr" id="hdr">
      <a href="index.html">Armel Kervennal</a>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
      <nav class="menu" id="menu" hidden>
        <a href="archive.html">archive</a>
        <a href="auto.html">automobile</a>
        <a href="about.html" class="is-current">about</a>
      </nav>
    </header>
    <div class="menu-scrim" id="menuScrim" hidden></div>

    <main id="about"></main>

    <script src="site-config.js"></script>
    <script src="menu.js"></script>
    <script src="colour.js"></script>
    <script>
      const site = window.SITE_CONFIG || {};
      const about = (site.content || {}).about || {};
      const contact = (site.content || {}).contact || {};
      const labels = (site.site || {}).labels || {};
      const story = about.story || [];
      const root = document.getElementById("about");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
      const phone = matchMedia("(max-width: 700px)");

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      // --- story ------------------------------------------------------
      const SHORT_TEXT = 110; // up to this length, a scene is set larger
      const stage = el("div", "stage");
      const scenes = el("div", "scenes");
      const sections = []; // every block that sets the page's colour
      const texts = []; // { box, words } lit up by the scroll
      const cycles = story.map((scene) => {
        const sec = el("section", "scene");
        sec.dataset.photo = scene.photo || "";
        const text = el("p", scene.text.length <= SHORT_TEXT ? "short" : null);
        const words = scene.text.split(/\s+/).filter(Boolean).map((word) => {
          const w = el("span", "w", word);
          text.append(w, " ");
          return w;
        });
        sec.appendChild(text);
        scenes.appendChild(sec);
        texts.push({ box: text, words });
        sections.push({ el: sec, color: scene.color });
        const img = el("img");
        img.alt = "";
        if (scene.photo) img.src = scene.photo;
        stage.appendChild(img);
        return { text, img, src: sec.dataset.photo, lab: hexToOklab(scene.color || "#ffffff") };
      });

      const storyEl = el("div", "story");
      storyEl.append(stage, scenes);
      root.appendChild(storyEl);

      // --- quote ------------------------------------------------------
      if (about.quote) {
        const q = el("figure", "quote");
        q.appendChild(el("p", null, "« " + about.quote + " »"));
        if (about.quoteAuthor) q.appendChild(el("figcaption", "label", about.quoteAuthor));
        root.appendChild(q);
        sections.push({ el: q, color: about.quoteColor });
      }

      // --- figures and equipment --------------------------------------
      const kit = el("section", "kit");
      const stats = el("div", "stats");
      function stat(value, label) {
        const s = el("div", "stat");
        s.append(el("b", null, value), el("span", "label", label));
        stats.appendChild(s);
      }
      // Counted from the albums, so these stay true by themselves.
      const albums = Object.values(site.projects || {});
      const photos = new Set(albums.flatMap((a) => a.photos || []));
      if (about.since) stat(about.since, labels.since || "depuis");
      stat(String(photos.size), labels.photos || "photos");
      stat(String(albums.length), labels.albums || "albums");
      kit.appendChild(stats);

      const gear = el("div");
      let lastLabel = null;
      let item = null;
      (about.gear || []).forEach((g) => {
        if (!item || g.label !== lastLabel) {
          item = el("div");
          const row = el("div", "gear-row");
          row.append(el("span", "label", g.label), item);
          gear.appendChild(row);
          lastLabel = g.label;
        }
        item.appendChild(el("div", "gear-title", g.title));
      });
      kit.appendChild(gear);
      root.appendChild(kit);
      sections.push({ el: kit, color: about.gearColor, phoneColor: about.gearColorPhone });

      // --- contact ----------------------------------------------------
      const cs = el("section", "contact");
      if (contact.note) cs.appendChild(el("p", "contact-note", contact.note));
      const mail = el("a", "mail", contact.email);
      mail.href = "mailto:" + contact.email;
      cs.appendChild(mail);

      const more = el("div", "contact-more");
      const copy = el("button", "copy", labels.copy || "copier");
      copy.type = "button";
      copy.addEventListener("click", async () => {
        await navigator.clipboard.writeText(contact.email);
        copy.textContent = labels.copied || "copié";
        setTimeout(() => (copy.textContent = labels.copy || "copier"), 1800);
      });
      more.appendChild(copy);
      if (contact.instagramHandle) {
        const a = el("a", null, contact.instagramHandle);
        a.href = contact.instagramUrl || "#";
        a.target = "_blank";
        a.rel = "noopener";
        more.appendChild(a);
      }
      if (contact.location) more.appendChild(el("span", null, contact.location));
      cs.appendChild(more);
      root.appendChild(cs);
      sections.push({ el: cs, color: about.contactColor, phoneColor: about.contactColorPhone });

      // The address fills the width, whatever its length.
      function fitMail() {
        const room = cs.clientWidth - 2 * parseFloat(getComputedStyle(cs).paddingLeft);
        mail.style.fontSize = "100px";
        const size = (100 * room) / mail.offsetWidth;
        mail.style.fontSize = Math.min(size, 190) + "px";
      }
      fitMail();
      document.fonts.ready.then(fitMail);
      window.addEventListener("resize", fitMail);

      // --- colour: same treatment as the homepage ---------------------
      // The block at the centre of the screen sets a target, and the
      // colour eases toward it in OKLab at its own pace.
      const EASE = 0.085; // lerp factor per 60fps frame
      const FRAME_MS = 1000 / 60;
      const SETTLED = 0.0015;
      let curLab = null;
      let targetLab = null;
      let painting = false;
      let lastPaint = 0;
      let paintedCss = null;
      let paintedDark = null;

      function applyColour() {
        const css = oklabToCss(curLab);
        if (css === paintedCss) return;
        paintedCss = css;
        document.documentElement.style.backgroundColor = css;
        document.body.style.backgroundColor = css;
        const dark = curLab[0] < 0.62;
        if (dark === paintedDark) return;
        paintedDark = dark;
        document.documentElement.style.setProperty("--fg", dark ? "#f2f2f2" : "#111111");
        document.documentElement.style.setProperty("--halo", dark ? "rgba(0, 0, 0, 0.6)" : "rgba(255, 255, 255, 0.85)");
      }

      function paint() {
        painting = false;
        const now = performance.now();
        const frames = Math.min(now - lastPaint, 100) / FRAME_MS;
        lastPaint = now;
        const ease = reduceMotion.matches ? 1 : 1 - Math.pow(1 - EASE, frames);

        let rest = 0;
        curLab = curLab.map((v, k) => {
          const nv = v + (targetLab[k] - v) * ease;
          rest = Math.max(rest, Math.abs(targetLab[k] - nv));
          return nv;
        });
        if (rest < SETTLED) curLab = targetLab;

        applyColour();

        if (curLab !== targetLab) {
          painting = true;
          requestAnimationFrame(paint);
        }
      }

      // The story follows the finger, with no easing of its own.
      function snapColour(lab) {
        curLab = targetLab = lab;
        applyColour();
      }

      function setColour(hex) {
        const lab = hexToOklab(hex || "#ffffff");
        if (targetLab && lab.every((v, k) => v === targetLab[k])) return;
        targetLab = lab;
        if (!curLab) curLab = lab;
        if (!painting) {
          painting = true;
          lastPaint = performance.now();
          requestAnimationFrame(paint);
        }
      }

      // --- scroll -----------------------------------------------------
      // Phone: each scene's clock runs from 0, its sentence at rest, to 1,
      // the next one at rest. The photos and the colour follow it exactly.
      const PHOTO_HOLDS = 0.17; // the photo starts to go as the text leaves
      const PHOTO_GONE = 0.45;
      const NEXT_STARTS = 0.48;
      const NEXT_ARRIVED = 0.8;
      const MAX_BLUR = 26;

      function smooth(from, to, t) {
        const x = Math.max(0, Math.min(1, (t - from) / (to - from)));
        return x * x * (3 - 2 * x);
      }

      function setPhoto(cycle, shown) {
        cycle.img.style.opacity = shown;
        cycle.img.style.filter = shown > 0 && shown < 1 ? "blur(" + (1 - shown) * MAX_BLUR + "px)" : "none";
      }

      // The last photo stays until the story scrolls away.
      function runPhoneCycles() {
        const height = window.innerHeight;
        const last = cycles.length - 1;
        const clock = -scenes.getBoundingClientRect().top / scenes.firstChild.offsetHeight;
        const held = Math.max(0, Math.min(clock, last));
        const index = Math.floor(held);
        const t = held - index;
        const from = cycles[index];
        const next = cycles[index + 1];

        cycles.forEach((cycle) => {
          let shown = 0;
          if (cycle === from) shown = next ? 1 - smooth(PHOTO_HOLDS, PHOTO_GONE, t) : 1;
          else if (cycle === next) shown = smooth(NEXT_STARTS, NEXT_ARRIVED, t);
          setPhoto(cycle, shown);
          // Gone before it climbs onto the sharp part of the next photo.
          const top = cycle.text.getBoundingClientRect().top;
          cycle.text.style.opacity = Math.max(0, Math.min(1, (top - height * 0.3) / (height * 0.25)));
        });

        if (clock > last) return false;
        const mix = smooth(NEXT_STARTS, NEXT_ARRIVED, t);
        snapColour(from.lab.map((v, k) => v + ((next || from).lab[k] - v) * mix));
        return true;
      }

      let shownPhoto = null;

      function showPhoto(src) {
        if (!src || src === shownPhoto) return;
        shownPhoto = src;
        cycles.forEach((cycle) => cycle.img.classList.toggle("on", cycle.src === src));
      }

      function lightWords() {
        const vh = window.innerHeight;
        // The opening sentence is on screen before any scroll: always lit.
        texts.forEach(({ box, words }, index) => {
          if (index === 0) {
            words.forEach((w) => (w.style.opacity = 1));
            return;
          }
          const r = box.getBoundingClientRect();
          // From the moment a text enters to when it sits centred.
          const progress = (vh * 0.9 - r.top) / (vh * 0.4 + r.height / 2);
          const lit = progress * words.length;
          words.forEach((w, i) => {
            const on = Math.max(0, Math.min(1, lit - i));
            w.style.opacity = reduceMotion.matches ? 1 : 0.16 + on * 0.84;
          });
        });
      }

      function onScroll() {
        scrollQueued = false;
        if (phone.matches && cycles.length && runPhoneCycles()) return;
        const middle = window.innerHeight / 2;
        const active = sections.find(({ el: s }) => {
          const r = s.getBoundingClientRect();
          return r.top <= middle && r.bottom > middle;
        });
        if (active) {
          setColour((phone.matches && active.phoneColor) || active.color);
          showPhoto(active.el.dataset.photo);
        }
        lightWords();
      }

      let scrollQueued = false;
      function queueScroll() {
        if (scrollQueued) return;
        scrollQueued = true;
        requestAnimationFrame(onScroll);
      }
      window.addEventListener("scroll", queueScroll, { passive: true });
      window.addEventListener("resize", queueScroll);
      // Turning a phone can cross over to the PC version, which is all CSS.
      phone.addEventListener("change", () => {
        cycles.forEach(({ img, text }) => {
          img.style.opacity = img.style.filter = text.style.opacity = "";
        });
      });
      // Each photo that loads pushes the page down: "load" doesn't bubble,
      // hence the capture.
      root.addEventListener("load", queueScroll, true);
      onScroll();
    </script>
  </body>
</html>
