<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Administration</title>
    <link rel="icon" type="image/png" href="Favicon/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Live Server reloads any open page when a file changes, which would
         cut an import short: its reload socket never connects here. -->
    <script>
      window.WebSocket = class {
        close() {}
        send() {}
      };
    </script>

    <style>
      :root {
        --ink: #111;
        --muted: rgba(17, 17, 17, 0.55);
        --line: rgba(17, 17, 17, 0.12);
        --soft: #f4f4f3;
        --accent: #1f5eff;
        --danger: #c01909;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font: 400 15px/1.5 "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--ink);
        background: #fff;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
      }
      [hidden] {
        display: none !important;
      }

      .btn {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 7px;
        padding: 7px 13px;
        white-space: nowrap;
        text-decoration: none;
      }
      .btn:hover:not(:disabled) {
        background: var(--soft);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .btn.primary {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .btn.primary:hover:not(:disabled) {
        background: #333;
      }
      .btn.danger {
        color: var(--danger);
      }
      .link {
        border: 0;
        background: none;
        color: var(--muted);
        text-decoration: none;
      }
      .link:hover {
        color: var(--ink);
      }

      /* --- connection screen -------------------------------------- */
      #gate {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      #gate h1 {
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      #gate p {
        max-width: 46ch;
        color: var(--muted);
      }
      #gateError {
        color: var(--danger) !important;
      }

      /* --- layout ------------------------------------------------- */
      #app {
        height: 100%;
        display: grid;
        grid-template: "bar bar" auto "nav main" 1fr / 190px 1fr;
      }
      #bar {
        grid-area: bar;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
      }
      #bar strong {
        font-weight: 500;
      }
      #status {
        color: var(--muted);
        font-size: 13px;
      }
      #status.dirty {
        color: var(--accent);
      }
      .spacer {
        flex: 1;
      }
      #nav {
        grid-area: nav;
        padding: 12px 8px;
        border-right: 1px solid var(--line);
        overflow-y: auto;
      }
      #nav button {
        display: flex;
        justify-content: space-between;
        width: 100%;
        border: 0;
        background: none;
        border-radius: 7px;
        padding: 8px 10px;
        text-align: left;
      }
      #nav button:hover {
        background: var(--soft);
      }
      #nav button.on {
        background: var(--ink);
        color: #fff;
      }
      #nav small {
        opacity: 0.55;
      }
      #main {
        grid-area: main;
        overflow-y: auto;
        padding: 22px 26px 80px;
      }
      .page {
        max-width: 1120px;
        margin: 0 auto;
      }

      /* --- page content ------------------------------------------- */
      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      h2 {
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      h3 {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 26px 0 10px;
      }
      .help {
        color: var(--muted);
        font-size: 13.5px;
        margin-bottom: 16px;
        max-width: 75ch;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 12px;
      }
      .field {
        display: block;
      }
      .field.wide {
        grid-column: 1 / -1;
      }
      .field > span {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .field input,
      .field textarea,
      .inline {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px 10px;
        background: #fff;
      }
      .field textarea,
      textarea.inline {
        resize: vertical;
        min-height: 70px;
      }
      input:focus,
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      input[type="color"] {
        width: 44px;
        height: 34px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
        flex: none;
      }

      .row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        margin-bottom: 8px;
        background: #fff;
      }
      .row.click {
        align-items: center;
        cursor: pointer;
      }
      .row.click:hover {
        background: var(--soft);
      }
      .row .grow {
        flex: 1;
        min-width: 0;
      }
      .grip {
        cursor: grab;
        color: var(--muted);
        user-select: none;
        padding: 6px 2px;
        line-height: 1;
      }
      .num {
        width: 22px;
        padding-top: 6px;
        font-size: 13px;
        color: var(--muted);
        text-align: right;
        flex: none;
      }
      .is-dragging {
        opacity: 0.35;
      }
      .drop-before {
        box-shadow: inset 0 3px 0 var(--accent);
      }
      .drop-after {
        box-shadow: inset 0 -3px 0 var(--accent);
      }
      .tile.drop-before {
        box-shadow: inset 4px 0 0 var(--accent);
      }
      .tile.drop-after {
        box-shadow: inset -4px 0 0 var(--accent);
      }
      .file-over {
        outline: 2px dashed var(--accent);
        outline-offset: 3px;
        border-radius: 8px;
      }

      /* --- photos ------------------------------------------------- */
      .photos {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 92px;
      }
      .tile {
        position: relative;
        height: 92px;
        min-width: 62px;
        background: var(--soft);
        border-radius: 5px;
        overflow: hidden;
      }
      .tile img {
        display: block;
        height: 100%;
        width: auto;
        min-width: 62px;
        object-fit: cover;
      }
      .tile.missing::after {
        content: "Fichier introuvable";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 4px;
        text-align: center;
        font-size: 11px;
        color: #fff;
        background: var(--danger);
      }
      .tile button {
        position: absolute;
        top: 3px;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-size: 12px;
        line-height: 22px;
        padding: 0;
        opacity: 0;
      }
      .tile:hover button,
      .tile button.on {
        opacity: 1;
      }
      .tile .x {
        right: 3px;
      }
      .tile .star {
        left: 3px;
      }
      .tile .star.on {
        background: #f2b61a;
        color: #000;
      }
      .add {
        height: 92px;
        min-width: 92px;
        border: 1px dashed var(--line);
        border-radius: 5px;
        background: none;
        color: var(--muted);
        padding: 0 10px;
      }
      .add:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .albums {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .album {
        border: 0;
        background: none;
        text-align: left;
        border-radius: 7px;
        overflow: hidden;
        cursor: pointer;
      }
      .album .tile {
        height: auto;
        aspect-ratio: 3 / 2;
        display: block;
      }
      .album .tile img {
        width: 100%;
      }
      .album b {
        display: block;
        font-weight: 500;
        font-size: 14px;
        margin-top: 4px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .album small {
        color: var(--muted);
      }

      /* --- modal -------------------------------------------------- */
      #modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.4);
        padding: 20px;
      }
      .box {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 460px;
        max-height: calc(100vh - 40px);
        background: #fff;
        border-radius: 12px;
        padding: 18px;
        gap: 12px;
      }
      .box.big {
        max-width: 1120px;
        height: calc(100vh - 40px);
      }
      .box h2 {
        font-size: 21px;
      }
      .picker {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 210px 1fr;
        grid-template-rows: minmax(0, 1fr);
        gap: 12px;
      }
      .folders {
        overflow-y: auto;
        border-right: 1px solid var(--line);
        padding-right: 8px;
      }
      .folders button {
        display: block;
        width: 100%;
        border: 0;
        background: none;
        padding: 5px 8px;
        border-radius: 6px;
        text-align: left;
        font-size: 13.5px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .folders button:hover {
        background: var(--soft);
      }
      .folders button.on {
        background: var(--ink);
        color: #fff;
      }
      .pickgrid {
        overflow-y: auto;
        align-content: flex-start;
        padding: 3px;
      }
      .pickgrid .tile {
        cursor: pointer;
      }
      .tile.picked {
        outline: 3px solid var(--accent);
        outline-offset: -3px;
      }
      .tile b {
        position: absolute;
        right: 4px;
        bottom: 4px;
        min-width: 20px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        font-weight: 500;
        text-align: center;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #toast {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 90vw;
        background: var(--ink);
        color: #fff;
        padding: 10px 16px;
        border-radius: 8px;
      }
      #toast.error {
        background: var(--danger);
      }
      #toast button {
        border: 0;
        background: none;
        color: #fff;
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div id="gate">
      <h1>Administration</h1>
      <p id="gateText">
        Choisis le dossier de ton site, celui qui contient
        <b>index.html</b> et <b>images</b>. Il faut Chrome ou Edge.
      </p>
      <button class="btn primary" id="gateBtn">Ouvrir le dossier du site</button>
      <button class="link" id="gateOther" hidden>Choisir un autre dossier</button>
      <p id="gateError"></p>
    </div>

    <div id="app" hidden>
      <header id="bar">
        <strong>Admin</strong>
        <span id="status"></span>
        <span class="spacer"></span>
        <button class="btn" id="undoBtn" title="Ctrl+Z">Annuler</button>
        <button class="btn" id="redoBtn" title="Ctrl+Y">Rétablir</button>
        <a class="btn" id="viewBtn" target="_blank">Voir le site</a>
        <button class="btn primary" id="saveBtn" title="Ctrl+S">Enregistrer</button>
      </header>
      <nav id="nav"></nav>
      <main id="main"></main>
    </div>

    <div id="modal" hidden></div>
    <div id="toast" hidden></div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden />

    <script>
      // ============================================================
      // HELPERS
      // ============================================================
      const $ = (id) => document.getElementById(id);

      function h(tag, props, ...kids) {
        const n = document.createElement(tag);
        Object.entries(props || {}).forEach(([k, v]) => {
          if (v == null) return;
          if (k === "class") n.className = v;
          else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
          else if (k in n) n[k] = v;
          else n.setAttribute(k, v);
        });
        n.append(...kids.flat(Infinity).filter((k) => k != null && k !== false));
        return n;
      }

      function slugify(text) {
        return (
          String(text)
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-|-$/g, "") || "sans-nom"
        );
      }

      let toastTimer;
      function toast(message, { error, undo: withUndo, stay } = {}) {
        const t = $("toast");
        t.className = error ? "error" : "";
        t.replaceChildren(message);
        if (withUndo) {
          t.append(h("button", { onclick: () => { undo(); t.hidden = true; } }, "Annuler"));
        }
        t.hidden = false;
        clearTimeout(toastTimer);
        if (!stay) toastTimer = setTimeout(() => (t.hidden = true), error ? 7000 : 4000);
      }

      // ============================================================
      // STORAGE: the site's folder, the remembered handle, thumbnails
      // ============================================================
      let root = null;

      function idb() {
        return new Promise((res, rej) => {
          const r = indexedDB.open("portfolio-admin", 2);
          r.onupgradeneeded = () => {
            ["handles", "thumbs"].forEach((s) => {
              if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s);
            });
          };
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      }
      async function idbGet(store, key) {
        const db = await idb();
        return new Promise((res) => {
          const q = db.transaction(store).objectStore(store).get(key);
          q.onsuccess = () => res(q.result);
          q.onerror = () => res(undefined);
        });
      }
      async function idbSet(store, key, value) {
        const db = await idb();
        db.transaction(store, "readwrite").objectStore(store).put(value, key);
      }

      function decode(part) {
        try {
          return decodeURIComponent(part);
        } catch {
          return part;
        }
      }
      async function dirAt(path, create) {
        let d = root;
        for (const p of path.split("/").filter(Boolean)) {
          d = await d.getDirectoryHandle(decode(p), { create: !!create }).catch(() => null);
          if (!d) return null;
        }
        return d;
      }
      async function fileAt(path) {
        const parts = path.split("/").filter(Boolean);
        const name = parts.pop();
        const d = await dirAt(parts.join("/"));
        return d ? d.getFileHandle(decode(name)).catch(() => null) : null;
      }

      const IMG = /\.(jpe?g|png|webp)$/i;

      async function imageFolders() {
        const out = [];
        const d = await dirAt("images");
        for await (const [name, handle] of d.entries()) {
          if (handle.kind === "directory") out.push({ name, path: "images/" + encodeURIComponent(name) });
        }
        return out.sort((a, b) => a.name.localeCompare(b.name, "fr", { numeric: true }));
      }
      async function imagesIn(path) {
        const out = [];
        const d = await dirAt(path);
        if (!d) return out;
        for await (const [name, handle] of d.entries()) {
          if (handle.kind === "file" && IMG.test(name)) out.push(path + "/" + encodeURIComponent(name));
        }
        return out.sort((a, b) => a.localeCompare(b, "fr", { numeric: true }));
      }

      // Small previews, kept between visits: full-size photos would make
      // this page crawl with 400 of them on screen.
      const thumbs = new Map();
      const waiting = [];
      let running = 0;

      function pump() {
        while (running < 3 && waiting.length) {
          running++;
          const job = waiting.pop();
          job().finally(() => {
            running--;
            pump();
          });
        }
      }
      async function makeThumb(src) {
        const handle = await fileAt(src);
        if (!handle) return null;
        const file = await handle.getFile();
        const key = src + "|" + file.lastModified + "|" + file.size;
        let blob = await idbGet("thumbs", key);
        if (!blob) {
          const bmp = await createImageBitmap(file, { resizeHeight: 200, resizeQuality: "medium" });
          const canvas = new OffscreenCanvas(bmp.width, bmp.height);
          canvas.getContext("2d").drawImage(bmp, 0, 0);
          bmp.close();
          blob = await canvas.convertToBlob({ type: "image/jpeg", quality: 0.72 });
          idbSet("thumbs", key, blob);
        }
        return URL.createObjectURL(blob);
      }
      function thumbOf(src) {
        if (!thumbs.has(src)) {
          thumbs.set(src, new Promise((res) => {
            waiting.push(() => makeThumb(src).catch(() => null).then(res));
            pump();
          }));
        }
        return thumbs.get(src);
      }
      const seen = new IntersectionObserver((entries) => {
        entries.forEach(({ isIntersecting, target }) => {
          if (!isIntersecting) return;
          seen.unobserve(target);
          thumbOf(target.dataset.src).then((url) => {
            if (url) target.src = url;
            else target.closest(".tile").classList.add("missing");
          });
        });
      });
      function photo(src) {
        const img = h("img", { alt: "", draggable: false });
        img.dataset.src = src;
        seen.observe(img);
        return img;
      }

      // --- import -----------------------------------------------------
      const MAX_SIDE = 2400; // beyond this, resized to EXPORT_SIDE
      const EXPORT_SIDE = 2048;
      const MAX_BYTES = 1.5 * 1024 * 1024;

      async function optimise(file) {
        const bmp = await createImageBitmap(file);
        const side = Math.max(bmp.width, bmp.height);
        if (side <= MAX_SIDE && file.size <= MAX_BYTES && /jpe?g$/i.test(file.type)) {
          bmp.close();
          return { blob: file, name: file.name };
        }
        const scale = Math.min(1, EXPORT_SIDE / side);
        const canvas = new OffscreenCanvas(Math.round(bmp.width * scale), Math.round(bmp.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
        bmp.close();
        const blob = await canvas.convertToBlob({ type: "image/jpeg", quality: 0.88 });
        return { blob, name: file.name.replace(/\.[^.]+$/, "") + ".jpg" };
      }

      async function freeName(dir, name) {
        const clean = name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.-]+/g, "-");
        const dot = clean.lastIndexOf(".");
        let candidate = clean;
        for (let i = 2; await dir.getFileHandle(candidate).catch(() => null); i++) {
          candidate = clean.slice(0, dot) + "-" + i + clean.slice(dot);
        }
        return candidate;
      }

      // Copies photos into the site's folder, resized for the web.
      async function importFiles(folder, files) {
        const list = [...files];
        const dir = await dirAt(folder, true);
        const added = [];
        const refused = [];
        for (const [i, file] of list.entries()) {
          toast("Import des photos… " + (i + 1) + " / " + list.length, { stay: true });
          try {
            const { blob, name } = await optimise(file);
            const finalName = await freeName(dir, name);
            const handle = await dir.getFileHandle(finalName, { create: true });
            const w = await handle.createWritable();
            await w.write(blob);
            await w.close();
            added.push(folder + "/" + encodeURIComponent(finalName));
          } catch {
            refused.push(file.name);
          }
        }
        if (refused.length) {
          toast("Non importées (format non lu, HEIC par exemple) : " + refused.join(", "), { error: true });
        } else {
          toast(added.length + " photo" + (added.length > 1 ? "s" : "") + " importée" + (added.length > 1 ? "s" : ""));
        }
        return added;
      }

      function chooseFiles() {
        return new Promise((res) => {
          const input = $("fileInput");
          input.value = "";
          input.onchange = () => res([...input.files]);
          input.oncancel = () => res([]);
          input.click();
        });
      }

      async function sizeOf(src) {
        const handle = await fileAt(src);
        const bmp = await createImageBitmap(await handle.getFile());
        const size = { src, w: bmp.width, h: bmp.height };
        bmp.close();
        return size;
      }

      // ============================================================
      // STATE: the config, save, undo
      // ============================================================
      const CFG_FILE = "site-config.js";
      let cfg = null;
      let savedJson = "";
      let diskText = "";
      let past = [];
      let future = [];
      let view = { page: "home" };

      const json = () => JSON.stringify(cfg);

      async function readDisk() {
        const handle = await root.getFileHandle(CFG_FILE);
        return (await handle.getFile()).text();
      }
      function parseCfg(text) {
        return JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1));
      }

      function snapshot() {
        past.push(json());
        if (past.length > 80) past.shift();
        future = [];
      }
      function commit(change) {
        snapshot();
        change();
        render();
      }
      function undo() {
        if (!past.length) return;
        future.push(json());
        cfg = JSON.parse(past.pop());
        render();
      }
      function redo() {
        if (!future.length) return;
        past.push(json());
        cfg = JSON.parse(future.pop());
        render();
      }

      function refreshBar() {
        const dirty = json() !== savedJson;
        $("status").textContent = dirty ? "Modifications non enregistrées" : "Tout est enregistré";
        $("status").className = dirty ? "dirty" : "";
        $("saveBtn").disabled = !dirty;
        $("undoBtn").disabled = !past.length;
        $("redoBtn").disabled = !future.length;
        const model = view.page === "model" && cfg.auto.series[view.index];
        $("viewBtn").href =
          view.page === "album" ? "archive.html?y=" + encodeURIComponent(cfg.projects[view.id].year) + "&p=" + encodeURIComponent(view.id)
          : model ? "auto.html?m=" + slugify(model.model)
          : { archive: "archive.html", auto: "auto.html", about: "about.html" }[view.page] || "index.html";
        document.title = (dirty ? "• " : "") + "Administration";
      }

      // What would break the site. Changes nothing, so the page stays as
      // it is for fixing the problem.
      function problems() {
        const out = [];
        Object.values(cfg.projects).forEach((p) => {
          if (!String(p.title || "").trim()) out.push("Un album n'a pas de titre.");
          if (!String(p.year || "").trim()) out.push("L'album « " + p.title + " » n'a pas d'année.");
          if (!p.photos.length) out.push("L'album « " + p.title + " » n'a aucune photo.");
        });
        cfg.auto.series.forEach((s) => {
          if (!s.groups.some((g) => g.photos.length)) out.push("La voiture « " + s.model + " » n'a aucune photo.");
        });
        return out;
      }

      // Clears what the editing leaves behind.
      function tidy() {
        cfg.sequence = cfg.sequence.filter((e) => blockPhotos(e).length);
        cfg.auto.series.forEach((s) => {
          s.groups = s.groups.filter((g) => g.photos.length);
          s.groups.forEach((g) => {
            if (!g.label) delete g.label;
          });
          if (!s.cover) s.cover = s.groups[0].photos[0].src;
        });
      }

      async function save() {
        const [problem] = problems();
        if (problem) {
          toast(problem + " Corrige-le avant d'enregistrer.", { error: true });
          return;
        }
        tidy();
        render();
        const now = await readDisk();
        if (now !== diskText && !confirm("Le fichier du site a changé depuis l'ouverture de l'admin. Remplacer par ta version ?")) return;
        const text = "var SITE_CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n";
        parseCfg(text);
        const handle = await root.getFileHandle(CFG_FILE);
        const w = await handle.createWritable();
        await w.write(text);
        await w.close();
        diskText = text;
        savedJson = json();
        refreshBar();
        toast("Enregistré sur ton PC. Pour publier : double-clique sur « Mettre en ligne.bat » dans le dossier du site.", { stay: false });
      }

      // ============================================================
      // DRAG AND DROP
      //
      // One rule for everything that can be reordered: an item knows its
      // list through get/set, so moving between two lists of the same
      // kind (one car's chapters, two home blocks) needs nothing extra.
      // ============================================================
      let drag = null;

      function clearMarks() {
        document.querySelectorAll(".drop-before, .drop-after").forEach((n) => n.classList.remove("drop-before", "drop-after"));
      }
      function moveItem(target, index) {
        const from = drag;
        commit(() => {
          if (from.owner === target.owner) {
            const list = from.get();
            const [item] = list.splice(from.index, 1);
            list.splice(index - (from.index < index ? 1 : 0), 0, item);
            from.set(list);
          } else {
            const source = from.get();
            const [item] = source.splice(from.index, 1);
            from.set(source);
            const list = target.get();
            list.splice(index, 0, item);
            target.set(list);
          }
        });
      }
      function sortable(item, { kind, owner, get, set, index, axis, handle }) {
        const list = { kind, owner, get, set };
        const start = (e) => {
          drag = { ...list, index };
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", "");
          item.classList.add("is-dragging");
          e.stopPropagation();
        };
        if (handle) {
          handle.addEventListener("mousedown", () => (item.draggable = true));
          item.addEventListener("mouseup", () => (item.draggable = false));
        } else {
          item.draggable = true;
        }
        item.addEventListener("dragstart", start);
        item.addEventListener("dragend", () => {
          drag = null;
          item.classList.remove("is-dragging");
          if (handle) item.draggable = false;
          clearMarks();
        });
        const after = (e) => {
          const r = item.getBoundingClientRect();
          return axis === "x" ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
        };
        item.addEventListener("dragover", (e) => {
          if (!drag || drag.kind !== kind) return;
          e.preventDefault();
          e.stopPropagation();
          clearMarks();
          item.classList.add(after(e) ? "drop-after" : "drop-before");
        });
        item.addEventListener("drop", (e) => {
          if (!drag || drag.kind !== kind) return;
          e.preventDefault();
          e.stopPropagation();
          moveItem(list, index + (after(e) ? 1 : 0));
        });
        return item;
      }

      function hasFiles(e) {
        return [...e.dataTransfer.types].includes("Files");
      }
      // Photos dragged in from the Windows explorer.
      function fileDrop(el, onFiles) {
        el.addEventListener("dragover", (e) => {
          if (!hasFiles(e)) return;
          e.preventDefault();
          e.stopPropagation();
          el.classList.add("file-over");
        });
        el.addEventListener("dragleave", () => el.classList.remove("file-over"));
        el.addEventListener("drop", (e) => {
          if (!hasFiles(e)) return;
          e.preventDefault();
          e.stopPropagation();
          el.classList.remove("file-over");
          onFiles([...e.dataTransfer.files]);
        });
      }

      // A row of photos. Items are plain paths, or {src, w, h} when
      // `sized` is set, as the automobile page needs them.
      function photoGrid({ kind, owner, get, set, folder, sized, cover, onCover, addLabel }) {
        const srcOf = (item) => (sized ? item.src : item);
        const list = get();
        const addAll = async (srcs) => {
          if (!srcs.length) return;
          const items = [];
          for (const src of srcs) items.push(sized ? await sizeOf(src) : src);
          commit(() => set([...get(), ...items]));
        };
        const grid = h("div", { class: "photos" },
          list.map((item, index) => {
            const src = srcOf(item);
            const isCover = cover === src;
            return sortable(
              h("div", { class: "tile" },
                photo(src),
                onCover && h("button", {
                  class: "star" + (isCover ? " on" : ""),
                  title: "Photo de couverture",
                  onclick: () => commit(() => onCover(src)),
                }, "★"),
                h("button", {
                  class: "x",
                  title: "Retirer du site (le fichier reste sur ton PC)",
                  onclick: () => {
                    commit(() => {
                      const next = get();
                      next.splice(index, 1);
                      set(next);
                      if (isCover && onCover) onCover(null);
                    });
                    toast("Photo retirée", { undo: true });
                  },
                }, "×"),
              ),
              { kind, owner, get, set, index, axis: "x" },
            );
          }),
          h("button", { class: "add", onclick: () => pickPhotos({ folder }).then(addAll) }, addLabel || "+ Ajouter"),
        );
        grid.addEventListener("dragover", (e) => {
          if (drag && drag.kind === kind) e.preventDefault();
        });
        grid.addEventListener("drop", (e) => {
          if (!drag || drag.kind !== kind) return;
          e.preventDefault();
          moveItem({ kind, owner, get, set }, list.length);
        });
        fileDrop(grid, async (files) => addAll(await importFiles(folder, files)));
        return grid;
      }

      // ============================================================
      // FORMS AND DIALOGS
      // ============================================================
      function bindEdit(input, read, write) {
        let typing = false;
        input.value = read() ?? "";
        input.addEventListener("focus", () => (typing = false));
        input.addEventListener("input", () => {
          if (!typing) snapshot();
          typing = true;
          write(input.value);
          refreshBar();
        });
        return input;
      }
      function field(label, obj, key, { long, wide, hint, placeholder } = {}) {
        const input = h(long ? "textarea" : "input", { placeholder });
        return h("label", { class: "field" + (wide || long ? " wide" : "") },
          h("span", null, label),
          bindEdit(input, () => obj[key], (v) => (obj[key] = v)),
          hint && h("span", { style: "margin-top:3px" }, hint),
        );
      }
      function colour(obj, key) {
        const input = h("input", { type: "color", title: "Couleur" });
        return bindEdit(input, () => obj[key] || "#ffffff", (v) => (obj[key] = v));
      }

      let cancelModal = null;

      function openModal(box, onCancel) {
        cancelModal = onCancel;
        $("modal").replaceChildren(box);
        $("modal").hidden = false;
      }
      function closeModal() {
        cancelModal = null;
        $("modal").hidden = true;
        $("modal").replaceChildren();
      }

      function ask(title, fields, confirmLabel) {
        return new Promise((res) => {
          const values = Object.fromEntries(fields.map((f) => [f.key, f.value || ""]));
          const done = (out) => {
            closeModal();
            res(out);
          };
          const form = h("form", {
            class: "box",
            onsubmit: (e) => {
              e.preventDefault();
              done(values);
            },
          },
            h("h2", null, title),
            fields.map((f) => field(f.label, values, f.key, { wide: true })),
            h("div", { class: "foot" },
              h("span", { class: "spacer" }),
              h("button", { class: "btn", type: "button", onclick: () => done(null) }, "Annuler"),
              h("button", { class: "btn primary" }, confirmLabel || "Créer"),
            ),
          );
          openModal(form, () => done(null));
          form.querySelector("input").focus();
        });
      }

      // Resolves with the chosen paths, in the order they were clicked.
      async function pickPhotos({ folder }) {
        const folders = await imageFolders();
        const known = folders.some((f) => f.path === folder);
        const target = folder;
        return new Promise((res) => {
          let current = known ? folder : (folders[0] || {}).path;
          const chosen = [];
          const list = h("div", { class: "folders" });
          const grid = h("div", { class: "photos pickgrid" });
          const count = h("span", { class: "help", style: "margin:0" });
          const addBtn = h("button", {
            class: "btn primary",
            disabled: true,
            onclick: () => {
              closeModal();
              res(chosen);
            },
          }, "Ajouter");
          const refreshCount = () => {
            count.textContent = chosen.length ? chosen.length + " sélectionnée" + (chosen.length > 1 ? "s" : "") : "Clique sur les photos à ajouter";
            addBtn.disabled = !chosen.length;
          };
          const markTile = (tile, src) => {
            const at = chosen.indexOf(src);
            tile.classList.toggle("picked", at >= 0);
            tile.querySelector("b")?.remove();
            if (at >= 0) tile.append(h("b", null, at + 1));
          };
          const refreshMarks = () => {
            grid.querySelectorAll(".tile").forEach((t) => markTile(t, t.dataset.src));
            refreshCount();
          };
          const showFolder = async (path) => {
            current = path;
            list.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.path === path));
            const srcs = await imagesIn(path);
            if (current !== path) return;
            grid.replaceChildren(...srcs.map((src) => {
              const tile = h("div", {
                class: "tile",
                onclick: () => {
                  const at = chosen.indexOf(src);
                  if (at >= 0) chosen.splice(at, 1);
                  else chosen.push(src);
                  refreshMarks();
                },
              }, photo(src));
              tile.dataset.src = src;
              markTile(tile, src);
              return tile;
            }));
            if (!srcs.length) grid.append(h("p", { class: "help" }, "Ce dossier est vide. Importe des photos depuis ton PC."));
          };
          const addFolderButton = (name, path) => {
            const b = h("button", { onclick: () => showFolder(path), title: name }, name);
            b.dataset.path = path;
            list.append(b);
          };
          if (!known) addFolderButton(decode(target.split("/").pop()) + " (nouveau)", target);
          folders.forEach((f) => addFolderButton(f.name, f.path));
          const doImport = async (files) => {
            if (!files.length) return;
            const added = await importFiles(target, files);
            chosen.push(...added);
            await showFolder(target);
            refreshMarks();
          };
          const box = h("div", { class: "box big" },
            h("div", { class: "foot" },
              h("h2", null, "Ajouter des photos"),
              h("span", { class: "spacer" }),
              h("button", { class: "btn primary", onclick: async () => doImport(await chooseFiles()) }, "Importer depuis mon PC"),
            ),
            h("p", { class: "help", style: "margin:0" }, "Tu peux aussi glisser des photos ici depuis l'explorateur. Elles sont copiées dans le site et allégées pour le web."),
            h("div", { class: "picker" }, list, grid),
            h("div", { class: "foot" },
              count,
              h("span", { class: "spacer" }),
              h("button", { class: "btn", onclick: () => { closeModal(); res([]); } }, "Annuler"),
              addBtn,
            ),
          );
          fileDrop(box, doImport);
          openModal(box, () => {
            closeModal();
            res([]);
          });
          showFolder(known ? folder : target);
          refreshCount();
        });
      }

      // ============================================================
      // PAGES
      // ============================================================
      const main = $("main");
      const go = (next) => {
        view = next;
        render();
        main.scrollTop = 0;
      };

      function grip() {
        return h("span", { class: "grip", title: "Glisser pour déplacer" }, "⠿");
      }
      function back(label, page) {
        return h("button", { class: "link", onclick: () => go({ page }) }, "← " + label);
      }

      // --- Accueil ----------------------------------------------------
      const HOME_FOLDER = "images/showcase";

      function blockPhotos(e) {
        return e.type === "group" ? [...(e.photos || [])] : e.src ? [e.src] : [];
      }
      function setBlockPhotos(e, photos) {
        if (photos.length === 1) {
          e.type = "single";
          e.src = photos[0];
          delete e.photos;
        } else {
          e.type = "group";
          e.photos = photos;
          delete e.src;
        }
      }

      function pageHome() {
        const blocks = () => [...cfg.sequence];
        const setBlocks = (list) => (cfg.sequence = list);
        const addBlocks = (srcs, together) => {
          if (!srcs.length) return;
          commit(() => {
            const groups = together ? [srcs] : srcs.map((s) => [s]);
            groups.forEach((photos) => {
              const e = { bg: "#ffffff" };
              setBlockPhotos(e, photos);
              cfg.sequence.unshift(e);
            });
          });
        };
        return [
          h("h2", null, "Accueil"),
          h("p", { class: "help" }, "Le défilé de la page principale, de haut en bas. Un bloc d'une photo l'affiche seule, plusieurs photos font un carrousel. La couleur est celle du fond derrière le bloc."),
          h("div", { class: "foot", style: "margin-bottom:14px" },
            h("button", { class: "btn primary", onclick: () => pickPhotos({ folder: HOME_FOLDER }).then((s) => addBlocks(s, false)) }, "+ Photos seules"),
            h("button", { class: "btn", onclick: () => pickPhotos({ folder: HOME_FOLDER }).then((s) => addBlocks(s, true)) }, "+ Carrousel"),
          ),
          cfg.sequence.map((entry, index) => {

            return sortable(
              h("div", { class: "row" },
                handle,
                h("span", { class: "num" }, index + 1),
                colour(entry, "bg"),
                h("div", { class: "grow" },
                  photoGrid({
                    kind: "home",
                    owner: entry,
                    folder: HOME_FOLDER,
                    get: () => blockPhotos(entry),
                    set: (list) => {
                      if (list.length) setBlockPhotos(entry, list);
                      else cfg.sequence.splice(cfg.sequence.indexOf(entry), 1);
                    },
                  }),
                ),
                index > 0 && h("button", {
                  class: "link",
                  title: "Mettre tout en haut",
                  onclick: () => commit(() => {
                    cfg.sequence.splice(index, 1);
                    cfg.sequence.unshift(entry);
                  }),
                }, "↑"),
              ),
              { kind: "block", owner: cfg.sequence, get: blocks, set: setBlocks, index, handle },
            );
          }),
        ];

      // --- Archive ----------------------------------------------------
      function albumIdsByYear() {
        const years = {};
        Object.keys(cfg.projects).forEach((id) => {
          const y = cfg.projects[id].year || "—";
          (years[y] = years[y] || []).push(id);
        });
        return years;
      }
      // Albums keep the order of the config's keys: rewriting the object
      // is what moves one.
      function setYearOrder(year, ids) {
        const years = albumIdsByYear();
        years[year] = ids;
        const next = {};
        Object.keys(cfg.projects).forEach((id) => {
          const y = cfg.projects[id].year || "—";
          if (y === year) {
            ids.forEach((i) => (next[i] = cfg.projects[i]));
          } else {
            next[id] = cfg.projects[id];
          }
        });
        cfg.projects = next;
      }

      async function newAlbum() {
        const values = await ask("Nouvel album", [
          { key: "title", label: "Titre" },
          { key: "year", label: "Année", value: String(new Date().getFullYear()) },
        ]);
        if (!values || !values.title.trim()) return;
        const base = slugify(values.title + "-" + values.year);
        let id = base;
        for (let i = 2; cfg.projects[id]; i++) id = base + "-" + i;
        const date = new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" }).format(new Date());
        const pretty = date[0].toUpperCase() + date.slice(1);
        commit(() => {
          cfg.projects = {
            [id]: { title: values.title.trim(), date: pretty, dateLong: pretty, year: values.year.trim(), location: "", photos: [] },
            ...cfg.projects,
          };
          view = { page: "album", id };
        });
      }

          ),
          h("h3", null, "Chapitres"),
          h("p", { class: "help" }, "★ choisit la photo phare, celle qui s'ouvre en grand. Glisse une photo vers un autre chapitre pour la déplacer. Sans titre, un chapitre s'affiche sans intertitre."),
          s.groups.map((g, index) => {
            const handle = grip();
            return sortable(
              h("div", { class: "row" },
                handle,
                h("div", { class: "grow" },
                  bindEdit(h("input", { class: "inline", placeholder: "Titre du chapitre", style: "margin-bottom:8px" }), () => g.label, (v) => (g.label = v)),
                  photoGrid({
                    kind: "auto",
                    owner: g,
                    sized: true,
                    folder: AUTO_FOLDER,
                    get: () => [...g.photos],
                    set: (list) => (g.photos = list),
                    cover,
                    onCover: (src) => {
                      if (src && s.cover !== src) s.cover = src;
                      else delete s.cover;
                    },
                  }),
                ),
                h("button", {
                  class: "link",
                  title: "Supprimer ce chapitre",
                  onclick: () => {
                    commit(() => s.groups.splice(index, 1));
                    toast("Chapitre supprimé", { undo: true });
                  },
                }, "×"),
              ),
              { kind: "chapter", owner: s, get: chapters, set: (l) => (s.groups = l), index, handle },
            );
          }),
          h("button", { class: "btn", onclick: () => commit(() => s.groups.push({ label: "", photos: [] })) }, "+ Nouveau chapitre"),
        ];
      }

      // --- À propos ---------------------------------------------------
      function pageAbout() {
        const about = cfg.content.about;
        const contact = cfg.content.contact;
        return [
          h("h2", null, "À propos"),
          h("h3", null, "Citation"),
          h("div", { class: "fields" },
            field("Citation", about, "quote", { long: true }),
            field("Auteur", about, "quoteAuthor"),
          ),
          h("h3", null, "Texte"),
          about.approche.map((text, index) => {
            const handle = grip();
            return sortable(
              h("div", { class: "row" },
                handle,
                bindEdit(h("textarea", { class: "inline grow", rows: 3 }), () => about.approche[index], (v) => (about.approche[index] = v)),
                h("button", { class: "link", title: "Supprimer", onclick: () => commit(() => about.approche.splice(index, 1)) }, "×"),
              ),
              { kind: "para", owner: about, get: () => [...about.approche], set: (l) => (about.approche = l), index, handle },
            );
          }),
          h("button", { class: "btn", onclick: () => commit(() => about.approche.push("")) }, "+ Paragraphe"),
          h("h3", null, "Équipement"),
          h("p", { class: "help" }, "Deux lignes qui se suivent avec la même catégorie s'affichent ensemble."),
          about.gear.map((g, index) => {
            const handle = grip();
            return sortable(
              h("div", { class: "row" },
                handle,
                h("div", { class: "grow fields" },
                  field("Catégorie", g, "label"),
                  field("Modèle", g, "title"),
                ),
                h("button", { class: "link", title: "Supprimer", onclick: () => commit(() => about.gear.splice(index, 1)) }, "×"),
              ),
              { kind: "gear", owner: about, get: () => [...about.gear], set: (l) => (about.gear = l), index, handle },
            );
          }),
          h("button", { class: "btn", onclick: () => commit(() => about.gear.push({ label: "", title: "" })) }, "+ Matériel"),
          h("h3", null, "Contact"),
          h("div", { class: "fields" },
            field("Email", contact, "email"),
            field("Basé à", contact, "location"),
            field("Instagram (nom affiché)", contact, "instagramHandle"),
            field("Instagram (lien)", contact, "instagramUrl"),
            field("Phrase de contact", contact, "note", { long: true }),
          ),
        ];
      }

      // --- Réglages ---------------------------------------------------
      async function replaceFavicon() {
        const [file] = await chooseFiles();
        if (!file) return;
        const bmp = await createImageBitmap(file);
        const side = Math.min(bmp.width, bmp.height, 512);
        const canvas = new OffscreenCanvas(side, side);
        const crop = Math.min(bmp.width, bmp.height);
        canvas.getContext("2d").drawImage(bmp, (bmp.width - crop) / 2, (bmp.height - crop) / 2, crop, crop, 0, 0, side, side);
        bmp.close();
        const blob = await canvas.convertToBlob({ type: "image/png" });
        const handle = await (await dirAt("Favicon", true)).getFileHandle("favicon.png", { create: true });
        const w = await handle.createWritable();
        await w.write(blob);
        await w.close();
        toast("Icône remplacée. Il reste à mettre en ligne.");
      }

      function pageSettings() {
        const site = cfg.site;
        const pageNames = { home: "Accueil", archive: "Archive", auto: "Automobile", about: "À propos" };
        return [
          h("h2", null, "Réglages du site"),
          h("h3", null, "Nom"),
          h("div", { class: "fields" }, field("Nom en haut de chaque page", site, "name")),
          h("h3", null, "Menu"),
          h("p", { class: "help" }, "Les noms affichés dans le menu aux trois barres, et leur ordre."),
          site.menu.map((item, index) => {
            const handle = grip();
            return sortable(
              h("div", { class: "row", style: "align-items:center" },
                handle,
                bindEdit(h("input", { class: "inline grow" }), () => item.label, (v) => (item.label = v)),
              ),
              { kind: "menu", owner: site, get: () => [...site.menu], set: (l) => (site.menu = l), index, handle },
            );
          }),
          h("h3", null, "Google et onglets du navigateur"),
          Object.entries(pageNames).map(([key, name]) =>
            h("div", { class: "row" },
              h("div", { class: "grow fields" },
                field(name + " : titre", site.pages[key], "title"),
                field(name + " : description", site.pages[key], "description"),
              ),
            ),
          ),
          h("h3", null, "Petits textes"),
          h("div", { class: "fields" },
            field("Bouton de fermeture d'une photo", site.labels, "close"),
            field("Libellé Email", site.labels, "email"),
            field("Libellé Instagram", site.labels, "instagram"),
            field("Libellé du lieu", site.labels, "location"),
          ),
          h("h3", null, "Icône de l'onglet"),
          h("div", { class: "foot" },
            h("img", { src: "Favicon/favicon.png", alt: "", style: "width:34px;height:34px;border-radius:6px" }),
            h("button", { class: "btn", onclick: replaceFavicon }, "Remplacer l'icône"),
          ),
        ];
      }

      const PAGES = {
        home: pageHome,
        archive: pageArchive,
        album: pageAlbum,
        auto: pageAuto,
        model: pageModel,
        about: pageAbout,
        settings: pageSettings,
      };
      const NAV = [
        ["home", "Accueil", () => cfg.sequence.length],
        ["archive", "Archive", () => Object.keys(cfg.projects).length],
        ["auto", "Automobile", () => cfg.auto.series.length],
        ["about", "À propos"],
        ["settings", "Réglages"],
      ];
      const PARENT = { album: "archive", model: "auto" };

      function render() {
        if (view.page === "album" && !cfg.projects[view.id]) view = { page: "archive" };
        if (view.page === "model" && !cfg.auto.series[view.index]) view = { page: "auto" };
        const y = main.scrollTop;
        const active = PARENT[view.page] || view.page;
        $("nav").replaceChildren(
          ...NAV.map(([page, label, count]) =>
            h("button", { class: page === active ? "on" : "", onclick: () => go({ page }) },
              label,
              count && h("small", null, count()),
            ),
          ),
        );
        main.replaceChildren(h("div", { class: "page" }, PAGES[view.page]()));
        main.scrollTop = y;
        refreshBar();
      }

      // ============================================================
      // START
      // ============================================================
      async function open(handle) {
        root = handle;
        let text;
        try {
          text = await readDisk();
        } catch {
          root = null;
          $("gateError").textContent = "Ce dossier ne contient pas site-config.js : ce n'est pas celui du site.";
          return;
        }
        cfg = parseCfg(text);
        diskText = text;
        savedJson = json();
        idbSet("handles", "root", handle);
        $("gate").hidden = true;
        $("app").hidden = false;
        render();
      }

      async function chooseFolder() {
        $("gateError").textContent = "";
        if (!window.showDirectoryPicker) {
          $("gateError").textContent = "Ce navigateur ne peut pas ouvrir de dossier : utilise Chrome ou Edge sur ton PC.";
          return;
        }
        try {
          await open(await window.showDirectoryPicker({ id: "portfolio", mode: "readwrite" }));
        } catch (e) {
          if (e.name !== "AbortError") $("gateError").textContent = e.message;
        }
      }

      async function start() {
        $("gateBtn").onclick = chooseFolder;
        $("gateOther").onclick = chooseFolder;
        const known = await idbGet("handles", "root").catch(() => null);
        if (!known) return;
        if ((await known.queryPermission({ mode: "readwrite" })) === "granted") {
          await open(known);
          return;
        }
        $("gateText").textContent = "Reprendre là où tu en étais, dans le dossier « " + known.name + " ».";
        $("gateBtn").textContent = "Continuer";
        $("gateOther").hidden = false;
        $("gateBtn").onclick = async () => {
          if ((await known.requestPermission({ mode: "readwrite" })) === "granted") await open(known);
        };
      }

      $("saveBtn").onclick = () => save().catch((e) => toast("Enregistrement impossible : " + e.message, { error: true }));
      $("undoBtn").onclick = undo;
      $("redoBtn").onclick = redo;

      $("modal").addEventListener("mousedown", (e) => {
        if (e.target === $("modal") && cancelModal) cancelModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && cancelModal) cancelModal();
        if (!cfg || !(e.ctrlKey || e.metaKey)) return;
        const key = e.key.toLowerCase();
        const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
        if (key === "s") {
          e.preventDefault();
          $("saveBtn").click();
        } else if (key === "z" && !e.shiftKey && !typing) {
          e.preventDefault();
          undo();
        } else if ((key === "y" || (key === "z" && e.shiftKey)) && !typing) {
          e.preventDefault();
          redo();
        }
      });
      window.addEventListener("beforeunload", (e) => {
        if (cfg && json() !== savedJson) e.preventDefault();
      });
      // A file dropped outside a photo area must not open in the tab.
      window.addEventListener("dragover", (e) => e.preventDefault());
      window.addEventListener("drop", (e) => e.preventDefault());

      start();
    </script>
  </body>
</html>
