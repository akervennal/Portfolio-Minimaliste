<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armel Kervennal — automobile</title>
    <meta
      name="description"
      content="Photographie automobile par Armel Kervennal."
    />
    <link rel="icon" type="image/png" href="Favicon/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- set synchronously so the pre-paint state matches what JS will draw -->
    <script>
      document.documentElement.className = "js";
    </script>

    <style>
      :root {
        --sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
        --ink: #111;
        --muted: rgba(17, 17, 17, 0.55);
        --line: rgba(17, 17, 17, 0.12);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --hdr-h: 72px;
        --gap: 13px;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: #fff;
      }

      body {
        font-family: var(--sans);
        font-weight: 400;
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      a {
        color: inherit;
      }

      .hdr {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 26px 32px;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.01em;
        /* no background: the soft halo vanishes on white and keeps the
           header readable when a photo scrolls underneath */
        --hdr-halo: drop-shadow(0 0 5px rgba(255, 255, 255, 0.85));
        transition: color 0.25s linear;
      }
      .hdr > a,
      .hdr > button,
      .menu {
        filter: var(--hdr-halo);
      }
      .hdr a {
        text-decoration: none;
      }
      .hdr a:hover {
        opacity: 0.55;
      }
      /* On a car's colour: no halo, and white on the dark ones. */
      .hdr.on-colour {
        --hdr-halo: none;
      }
      .hdr.on-dark {
        color: #fff;
        --hdr-halo: none;
      }

      .reveal {
        transition:
          opacity 0.7s var(--ease),
          transform 0.7s var(--ease);
      }
      .js .reveal {
        opacity: 0;
        transform: translateY(14px);
      }
      .reveal.in {
        opacity: 1;
        transform: none;
      }

      /* ============================================================
         LIST — one giant name per model; the page eases to the colour
         of whichever car is at the centre of the screen
         ============================================================ */
      .models {
        padding: 14svh var(--gap);
      }
      .model {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        min-height: 72svh;
        text-decoration: none;
        opacity: 0.3;
      }
      /* The index: every brand, small, to jump to its first model.
         Fixed in the bottom right corner, clear of the photos on the left
         of a big screen. */
      .index {
        position: fixed;
        right: var(--gap);
        bottom: 28px;
        z-index: 10;
        --index-line: 28px;
        font-size: 20px;
        font-weight: 500;
      }
      /* Five brands at most on screen: past that the list scrolls, by
         hand or by itself to keep the brand on screen in view (see
         followIndex), and fades out at the edge that has more. */
      .index-list {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        max-height: calc(5 * var(--index-line) + 4 * 2px);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        line-height: var(--index-line);
      }
      .index-list::-webkit-scrollbar {
        display: none;
      }
      .index-list.more-above {
        -webkit-mask-image: linear-gradient(transparent, #000 var(--index-line));
        mask-image: linear-gradient(transparent, #000 var(--index-line));
      }
      .index-list.more-below {
        -webkit-mask-image: linear-gradient(#000 calc(100% - var(--index-line)), transparent);
        mask-image: linear-gradient(#000 calc(100% - var(--index-line)), transparent);
      }
      .index-list.more-above.more-below {
        -webkit-mask-image: linear-gradient(
          transparent,
          #000 var(--index-line),
          #000 calc(100% - var(--index-line)),
          transparent
        );
        mask-image: linear-gradient(
          transparent,
          #000 var(--index-line),
          #000 calc(100% - var(--index-line)),
          transparent
        );
      }
      .index a {
        text-decoration: none;
        opacity: 0.45;
        transition: opacity 0.3s;
      }
      .index a:hover,
      .index a.is-active {
        opacity: 1;
      }

      /* Only the car whose colour is the page's opens. */
      .model:not(.is-active) {
        cursor: default;
      }
      .model-name {
        align-self: flex-start;
        font-size: clamp(52px, 12vw, 190px);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 0.95;
        /* one line always: fitNames() shrinks the ones that would wrap */
        white-space: nowrap;
      }
      .model-cover {
        display: block;
        width: min(42vw, 620px);
        aspect-ratio: 3 / 2;
        object-fit: cover;
      }
      /* After the last car: the reader's own, with a way to book. */
      .shoot-cta {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        min-height: 72svh;
        text-decoration: none;
      }
      .shoot-cta-sub {
        font-size: clamp(20px, 2.4vw, 34px);
        font-weight: 500;
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 6px;
      }
      .shoot-cta:hover {
        opacity: 0.6;
      }

      /* ============================================================
         GALLERY — on the car's colour: its name, its photo settled a
         little below mid-height with the gallery showing underneath, then
         its chapters, built like a shoot: the whole car, the details, the
         action. coverBox() in the script mirrors --cover-h and --cover-top.
         ============================================================ */
      .gallery {
        --locs-gap: var(--gap);
        --cover-h: min(60svh, calc((100vw - 2 * var(--gap)) / 1.5));
        --cover-top: calc(55svh - var(--cover-h) / 2);
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .cover {
        order: -1;
        padding: var(--cover-top) var(--gap) 0;
      }
      .cover img {
        display: block;
        width: auto;
        height: var(--cover-h);
        aspect-ratio: 3 / 2;
        object-fit: cover;
      }
      /* the title sits on top of that photo, in the space above it */
      .gallery > .yr-head {
        position: absolute;
        top: var(--cover-top);
        left: 0;
        right: 0;
        width: 100%;
        margin: 0;
        transform: translateY(calc(-100% - 12px));
      }
      /* The photo count slides in from the right once the gallery is in.
         Backwards only: a held end state would block the hover fade. */
      .gallery .yr-meta {
        animation: meta-in 0.6s var(--ease) backwards;
      }
      @keyframes meta-in {
        from {
          opacity: 0;
          transform: translateX(64px);
        }
      }
      .ser {
        padding-top: 24px;
        padding-bottom: 14vh;
      }
      .chapter {
        margin-top: 64px;
        padding: 0 var(--gap);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .chapter + .grid {
        padding-top: 14px;
      }
      .grid + .grid {
        margin-top: 64px;
      }

      /* Cascade version of the album grid: photos keep their own ratio
         (--r) and stack in columns, each going to the shortest one. */
      .grid.organic {
        --grid-gap: 13px;
        display: flex;
        align-items: flex-start;
      }
      .organic-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--grid-gap);
      }
      .organic .grid-idx {
        display: none;
      }
      .organic button {
        width: 100%;
      }
      .organic .grid-thumb {
        height: auto;
        aspect-ratio: var(--r);
      }
      .organic .grid-thumb img {
        width: 100%;
      }

      @media (max-width: 700px) {
        :root {
          --hdr-h: 58px;
        }
        /* The photos run the phone's width, so the corner behind the
           index blurs, fading out with no edge. */
        .index {
          right: 20px;
          bottom: 24px;
          --index-line: 24px;
          font-size: 15px;
        }
        .index::before {
          content: "";
          position: absolute;
          z-index: -1;
          inset: -70px -20px -24px -90px;
          -webkit-backdrop-filter: blur(10px);
          backdrop-filter: blur(10px);
          /* Fades out toward the bottom too: on iOS Safari the page goes
             on, unblurred, under the toolbar below this edge. */
          -webkit-mask-image:
            radial-gradient(ellipse at 100% 100%, #000 45%, transparent 75%),
            linear-gradient(#000 calc(100% - 40px), transparent);
          -webkit-mask-composite: source-in;
          mask-image:
            radial-gradient(ellipse at 100% 100%, #000 45%, transparent 75%),
            linear-gradient(#000 calc(100% - 40px), transparent);
          mask-composite: intersect;
          pointer-events: none;
        }
        .hdr {
          padding: 20px 20px;
          font-size: 15px;
        }
        .model {
          min-height: 64svh;
          gap: 18px;
        }
        .model-cover {
          width: 100%;
        }
        /* Phones: the photo runs the screen's width and settles at
           mid-height. 33.33vw is half the height of a 3:2 photo at full
           width. */
        .gallery {
          --cover-h: 66.67vw;
          --cover-top: calc(50svh - 33.33vw);
        }
        .cover {
          padding: var(--cover-top) 0 0;
        }
        .cover img {
          width: 100%;
          height: auto;
        }
        .chapter {
          margin-top: 44px;
        }
        .grid + .grid {
          margin-top: 40px;
        }
        .grid.organic {
          --grid-gap: 12px;
        }
      }

      @view-transition {
        navigation: auto;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.5s;
        animation-timing-function: var(--ease);
      }
      /* The list photo growing into the gallery's one. On a big screen
         this view transition stutters and flyCover() below takes over
         with .car-fly and .car-veil; phones keep it. */
      ::view-transition-group(car-cover) {
        animation-duration: 0.8s;
        animation-timing-function: var(--ease);
      }
      ::view-transition-old(car-cover),
      ::view-transition-new(car-cover) {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* The model's name resizes into the gallery's title. */
      ::view-transition-group(car-title) {
        animation-duration: 0.8s;
        animation-timing-function: var(--ease);
      }
      ::view-transition-old(car-title),
      ::view-transition-new(car-title) {
        width: auto;
        height: 100%;
      }

      .car-veil {
        position: fixed;
        inset: 0;
        z-index: 39;
        background: #fff;
      }
      .car-fly {
        position: fixed;
        z-index: 40;
        object-fit: cover;
        transform-origin: 0 0;
        will-change: transform;
      }
      .car-fly-name {
        position: fixed;
        z-index: 41;
        margin: 0;
        font-weight: 500;
        white-space: nowrap;
        pointer-events: none;
        transform-origin: 0 0;
        will-change: transform;
      }

      @media (prefers-reduced-motion: reduce) {
        .hdr,
        .reveal {
          transition: none;
        }
        .gallery .yr-meta {
          animation: none;
        }
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
      }
    </style>
    <link rel="stylesheet" href="menu.css" />
    <link rel="stylesheet" href="gallery.css" />
  </head>

  <body data-page="auto">
    <header class="hdr" id="hdr">
      <a href="index.html">Armel Kervennal</a>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
      <nav class="menu" id="menu" hidden>
        <a href="archive.html">archive</a>
        <a href="auto.html" class="is-current">automobile</a>
        <a href="shooting.html">session photo</a>
        <a href="about.html">about</a>
      </nav>
    </header>
    <div class="menu-scrim" id="menuScrim" hidden></div>

    <main id="view"></main>

    <div class="lb" id="lb">
      <button class="lb-close" id="lbClose">fermer · esc</button>
      <button class="lb-nav prev" id="lbPrev" aria-label="Photo précédente"></button>
      <div class="lb-stage" id="lbStage"></div>
      <button class="lb-nav next" id="lbNext" aria-label="Photo suivante"></button>
      <div class="lb-counter" id="lbCounter"></div>
    </div>

    <script src="site-config.js"></script>
    <script src="menu.js"></script>
    <script src="gallery.js"></script>
    <script src="colour.js"></script>
    <script>
      // A car shows up once it has photos; without a chosen cover, its
      // first photo stands in.
      const series = (((window.SITE_CONFIG && SITE_CONFIG.auto) || {}).series || [])
        .map((s) => ({ ...s, cover: s.cover || s.groups.flatMap((g) => g.photos)[0]?.src }))
        .filter((s) => s.cover);
      const hdr = document.getElementById("hdr");
      const view = document.getElementById("view");
      const phone = matchMedia("(max-width: 700px)");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

      // We put the scroll back ourselves when returning to the list.
      history.scrollRestoration = "manual";

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      // Set in the admin, or else the model's first word.
      function brandOf(s) {
        return (s.brand || "").trim() || s.model.trim().split(/\s+/)[0];
      }

      function slug(model) {
        return model
          .normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-");
      }

      function fromURL() {
        const m = new URLSearchParams(location.search).get("m");
        return series.find((s) => slug(s.model) === m) || null;
      }

      function urlFor(s) {
        return s ? "auto.html?m=" + slug(s.model) : "auto.html";
      }

      function setPage(bg, ink, muted) {
        document.documentElement.style.backgroundColor = bg;
        document.body.style.backgroundColor = bg;
        document.body.style.color = ink;
        document.documentElement.style.setProperty("--muted", muted);
      }

      // --- list -------------------------------------------------------
      let current = null; // the model on screen, null on the list
      let activeRow = null;
      let listY = 0;

      let rows = [];

      const centreLine = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting || current) return;
            activateRow(entry.target);
          });
        },
        { rootMargin: "-50% 0px -50% 0px" },
      );

      // Same treatment as the homepage (see the scroll loop in index.html):
      // the row at the centre sets a target, and the colour and the rows'
      // opacity ease toward it, in OKLab, at their own pace.
      const EASE = 0.085; // lerp factor per 60fps frame, ~600ms to settle
      const FRAME_MS = 1000 / 60;
      const SETTLED = 0.0015; // below this distance-to-target, snap and stop
      const ROW_REST = 0.3;
      const WHITE_LAB = hexToOklab("#ffffff");
      const KEEP_COLOUR_PX = 40; // gallery: scroll that turns the page white
      let curLab = null;
      let targetLab = null;
      let painting = false;
      let lastPaint = 0;

      // Scaled by the time since the last frame: a fixed factor per frame
      // would run twice as fast on a 120Hz phone screen.
      function paintList() {
        painting = false;
        if (!targetLab) return;
        const now = performance.now();
        const frames = Math.min(now - lastPaint, 100) / FRAME_MS;
        lastPaint = now;
        const ease = reduceMotion.matches ? 1 : 1 - Math.pow(1 - EASE, frames);
        let settling = false;

        if (!curLab) {
          curLab = targetLab;
        } else {
          let rest = 0;
          curLab = curLab.map((v, k) => {
            const nv = v + (targetLab[k] - v) * ease;
            rest = Math.max(rest, Math.abs(targetLab[k] - nv));
            return nv;
          });
          if (rest < SETTLED) curLab = targetLab;
          else settling = true;
        }

        rows.forEach((row) => {
          const target = row === activeRow ? 1 : ROW_REST;
          let op = row.opacity + (target - row.opacity) * ease;
          if (Math.abs(target - op) < SETTLED) op = target;
          else settling = true;
          row.opacity = op;
          row.el.style.opacity = op;
        });

        const dark = curLab[0] < 0.62;
        const muted = dark ? "rgba(242, 242, 242, 0.6)" : "rgba(17, 17, 17, 0.55)";
        setPage(oklabToCss(curLab), dark ? "#f2f2f2" : "#111111", muted);
        const white = curLab === WHITE_LAB;
        hdr.classList.toggle("on-colour", !dark && !white);
        hdr.classList.toggle("on-dark", dark);

        if (settling && !painting) {
          painting = true;
          requestAnimationFrame(paintList);
        }
      }

      function easeTo(lab) {
        targetLab = lab;
        if (!painting) {
          painting = true;
          lastPaint = performance.now();
          requestAnimationFrame(paintList);
        }
      }

      function setActive(row, instant) {
        activeRow = row;
        rows.forEach((r) => {
          r.el.classList.toggle("is-active", r === row);
          r.link.classList.toggle("is-active", r.link === row.link);
        });
        followIndex(row.link, instant);
      }

      // Keeps the active brand in the middle of the index when the index
      // is too long to show whole. Eased by hand: a smooth scrollTo() here
      // would cut short the page's own smooth scroll after an index click.
      const FOLLOW_MS = 400;
      let indexList = null;
      let followFrame = null;

      function followIndex(link, instant) {
        if (!indexList || indexList.scrollHeight <= indexList.clientHeight) return;
        const list = indexList;
        const max = list.scrollHeight - list.clientHeight;
        const to = Math.max(0, Math.min(max, link.offsetTop - (list.clientHeight - link.offsetHeight) / 2));
        cancelAnimationFrame(followFrame);
        if (instant || reduceMotion.matches) {
          list.scrollTop = to;
          return;
        }
        const from = list.scrollTop;
        const start = performance.now();
        const step = (now) => {
          const t = Math.min((now - start) / FOLLOW_MS, 1);
          list.scrollTop = from + (to - from) * (1 - Math.pow(1 - t, 3));
          if (t < 1) followFrame = requestAnimationFrame(step);
        };
        followFrame = requestAnimationFrame(step);
      }

      function indexEdges() {
        const l = indexList;
        l.classList.toggle("more-above", l.scrollTop > 1);
        l.classList.toggle("more-below", l.scrollTop + l.clientHeight < l.scrollHeight - 1);
      }

      function activateRow(rowEl) {
        setActive(rows.find((row) => row.el === rowEl));
        easeTo(hexToOklab(series[+rowEl.dataset.i].color));
      }

      // Back from a gallery or on first load: no easing in, the page is
      // simply already on the row at the centre of the screen.
      function snapToCentre() {
        const middle = window.innerHeight / 2;
        const row =
          rows.find(({ el }) => {
            const r = el.getBoundingClientRect();
            return r.top <= middle && r.bottom > middle;
          }) || rows[0];
        setActive(row, true);
        targetLab = hexToOklab(series[+row.el.dataset.i].color);
        curLab = targetLab;
        rows.forEach((r) => {
          r.opacity = r === row ? 1 : ROW_REST;
        });
        paintList();
      }

      function renderList() {
        const nav = el("nav", "models");
        const index = el("nav", "index");
        index.setAttribute("aria-label", "Index");
        indexList = el("div", "index-list");
        indexList.addEventListener("scroll", indexEdges, { passive: true });
        index.appendChild(indexList);
        const brands = new Map(); // brand -> its link, which goes to its first model
        const covers = [];
        rows = [];
        series.forEach((s, i) => {
          const a = el("a", "model");
          a.href = urlFor(s);
          a.dataset.i = i;
          a.appendChild(el("span", "model-name", s.model));
          const img = el("img", "model-cover");
          // Only the photos about to come on screen load. Browsers defer
          // an image only once it is in the page, hence the src set below.
          if (i > 1) img.loading = "lazy";
          covers.push([img, s.cover]);
          img.alt = s.model;
          a.appendChild(img);
          a.addEventListener("click", (e) => {
            e.preventDefault();
            if (activeRow && activeRow.el === a) navigate(s);
          });
          nav.appendChild(a);

          // Brings the brand's first model to the centre, where it takes
          // over the page.
          const brand = brandOf(s);
          let link = brands.get(brand);
          if (!link) {
            link = el("a", null, brand);
            link.href = urlFor(s);
            link.addEventListener("click", (e) => {
              e.preventDefault();
              a.scrollIntoView({ block: "center", behavior: reduceMotion.matches ? "auto" : "smooth" });
            });
            brands.set(brand, link);
            indexList.appendChild(link);
          }

          rows.push({ el: a, link, opacity: ROW_REST });
          centreLine.observe(a);
        });
        const shooting = ((window.SITE_CONFIG && SITE_CONFIG.content) || {}).shooting || {};
        if (shooting.autoLink) {
          const cta = el("a", "shoot-cta");
          cta.href = "shooting.html";
          cta.append(el("span", "model-name", shooting.autoLink));
          if (shooting.autoLinkSub) cta.appendChild(el("span", "shoot-cta-sub", shooting.autoLinkSub));
          nav.appendChild(cta);
        }
        view.replaceChildren(index, nav);
        covers.forEach(([img, src]) => (img.src = src));
        indexEdges();
        fitNames();
      }

      // A name too long for the width is set just small enough to fit.
      function fitNames() {
        const nav = view.querySelector(".models");
        if (!nav) return;
        const pad = getComputedStyle(nav);
        const room = nav.clientWidth - parseFloat(pad.paddingLeft) - parseFloat(pad.paddingRight);
        nav.querySelectorAll(".model-name").forEach((name) => {
          name.style.fontSize = "";
          if (name.scrollWidth > room) {
            name.style.fontSize = (parseFloat(getComputedStyle(name).fontSize) * room) / name.scrollWidth + "px";
          }
        });
      }
      document.fonts.ready.then(fitNames);
      window.addEventListener("resize", fitNames);

      // --- gallery ----------------------------------------------------
      let cascades = [];

      function layoutCascade({ grid, cells, ratios }) {
        const cols = Array.from({ length: phone.matches ? 2 : 3 }, () => el("div", "organic-col"));
        const heights = cols.map(() => 0);
        cells.forEach((cell, i) => {
          const k = heights.indexOf(Math.min(...heights));
          cols[k].appendChild(cell);
          heights[k] += 1 / ratios[i];
        });
        grid.replaceChildren(...cols);
      }

      phone.addEventListener("change", () => cascades.forEach(layoutCascade));

      function buildCover(s) {
        const cover = el("div", "cover");
        const img = document.createElement("img");
        img.src = s.cover;
        img.alt = s.model;
        cover.appendChild(img);
        return cover;
      }

      function renderGallery(s) {
        const all = s.groups.flatMap((g) => g.photos.map((p) => p.src));
        const wrap = el("div", "gallery");
        wrap.appendChild(buildCover(s));

        const head = el("a", "yr-head");
        head.href = urlFor(null);
        head.append(el("span", "yr-y", s.model), el("span", "yr-meta", photoCount(s)));
        head.addEventListener("click", (e) => {
          e.preventDefault();
          navigate(null);
        });
        wrap.appendChild(head);

        const sec = el("section", "ser");
        cascades = [];
        let offset = 0;
        s.groups.forEach((group) => {
          if (group.label) sec.appendChild(el("h3", "chapter", group.label));
          const grid = buildPhotoGrid(group.photos.map((p) => p.src), s.model, all, offset);
          grid.classList.add("organic");
          const cells = [...grid.children];
          const ratios = group.photos.map((p) => p.w / p.h);
          cells.forEach((cell, i) => cell.style.setProperty("--r", ratios[i].toFixed(3)));
          const cascade = { grid, cells, ratios };
          cascades.push(cascade);
          layoutCascade(cascade);
          sec.appendChild(grid);
          offset += group.photos.length;
        });

        wrap.appendChild(sec);
        view.replaceChildren(wrap);

        // Arrives on the car's colour, which fades out on scroll
        // (galleryColour).
        rows = [];
        targetLab = galleryLab = hexToOklab(s.color);
        paintList();
      }

      let galleryLab = null;

      function galleryColour() {
        if (!current) return;
        const lab = window.pageYOffset > KEEP_COLOUR_PX ? WHITE_LAB : galleryLab;
        if (lab !== targetLab) easeTo(lab);
      }
      window.addEventListener("scroll", galleryColour, { passive: true });

      // --- routing ----------------------------------------------------
      function coverOf(s) {
        if (s) return view.querySelector(".cover img");
        return activeRow && activeRow.el.querySelector(".model-cover");
      }

      function show(s) {
        current = s;
        if (s) {
          renderGallery(s);
          window.scrollTo(0, 0);
        } else {
          renderList();
          window.scrollTo(0, listY);
          snapToCentre();
        }
      }

      // The photo of the car being opened (or left) grows into the other
      // view's: same view-transition-name on both sides of the swap.
      function go(s) {
        if (s === current || flying) return;
        if (!current) listY = window.pageYOffset;
        // Gallery to gallery (back and forward buttons): no photo to fly.
        if (current && s) {
          show(s);
          return;
        }

        if (!document.startViewTransition || reduceMotion.matches) {
          show(s);
          return;
        }

        const row = s ? view.querySelector('.model[data-i="' + series.indexOf(s) + '"] img') : null;
        const before = row || coverOf(current);
        // The gallery's photo stays on screen, so getting covered by the
        // page is what counts for it, not its position.
        const visible =
          before &&
          (s ? before.getBoundingClientRect().bottom > 0 : window.pageYOffset < window.innerHeight / 2);
        if (visible && !phone.matches) {
          lastModel = s || lastModel;
          flyCover(s, before);
          return;
        }
        const titleOf = (img) => (img.closest(".model") ? img.closest(".model").querySelector(".model-name") : view.querySelector(".yr-y"));
        const titleBefore = visible ? titleOf(before) : null;
        if (visible) {
          before.style.viewTransitionName = "car-cover";
          titleBefore.style.viewTransitionName = "car-title";
        }

        let after = null;
        let titleAfter = null;
        const transition = document.startViewTransition(() => {
          if (before) before.style.viewTransitionName = "";
          if (titleBefore) titleBefore.style.viewTransitionName = "";
          show(s);
          after = s ? coverOf(s) : view.querySelector('.model[data-i="' + series.indexOf(lastModel) + '"] img');
          if (visible && after) {
            after.style.viewTransitionName = "car-cover";
            titleAfter = titleOf(after);
            titleAfter.style.viewTransitionName = "car-title";
          }
        });
        lastModel = s || lastModel;
        transition.updateCallbackDone.catch(() => {});
        transition.ready.catch(() => {});
        transition.finished.catch(() => {}).finally(() => {
          if (after) after.style.viewTransitionName = "";
          if (titleAfter) titleAfter.style.viewTransitionName = "";
        });
      }

      let lastModel = null;
      let flying = false;

      const FLY_MS = 800;
      const FLY_EASE = "cubic-bezier(0.16, 1, 0.3, 1)";

      // Where the gallery's photo will sit, before the gallery exists:
      // the same sums as --cover-h and --cover-top in the CSS.
      function coverBox() {
        const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap"));
        const vh = window.innerHeight;
        const height = Math.min(vh * 0.6, (window.innerWidth - 2 * gap) / 1.5);
        return { left: gap, top: vh * 0.55 - height / 2, width: height * 1.5, height };
      }

      function photoCount(s) {
        return String(s.groups.reduce((n, g) => n + g.photos.length, 0));
      }

      // Where the gallery's title and count will sit: a hidden copy of its
      // header, laid out by the same CSS.
      function headBox(s) {
        const probe = el("div", "gallery");
        probe.style.cssText = "position: fixed; top: 0; left: 0; width: 100%; visibility: hidden";
        const head = el("div", "yr-head");
        const title = el("span", "yr-y", s.model);
        const meta = el("span", "yr-meta", photoCount(s));
        meta.style.animation = "none";
        head.append(title, meta);
        probe.appendChild(head);
        document.body.appendChild(probe);
        const style = getComputedStyle(meta);
        const box = {
          title: title.getBoundingClientRect(),
          meta: meta.getBoundingClientRect(),
          metaStyle: {
            fontSize: style.fontSize,
            lineHeight: style.lineHeight,
            letterSpacing: style.letterSpacing,
            color: style.color,
          },
        };
        probe.remove();
        return box;
      }

      // The model's name flies with the photo, resized into the other
      // view's: centre on centre, left edge on left edge.
      function nameFlight(name, to) {
        const from = name.getBoundingClientRect();
        const style = getComputedStyle(name);
        const size = parseFloat(style.fontSize);
        const fly = el("span", "car-fly-name", name.textContent);
        Object.assign(fly.style, {
          left: from.left + "px",
          top: from.top + "px",
          fontSize: size + "px",
          lineHeight: style.lineHeight,
          letterSpacing: style.letterSpacing,
          color: style.color,
        });
        document.body.appendChild(fly);
        // By width: the two names don't share the same letter spacing.
        const k = to.width / from.width;
        const dx = to.left - from.left;
        const dy = to.top + to.height / 2 - from.top - (from.height * k) / 2;
        return { fly, keyframes: [{ transform: "none" }, { transform: "translate(" + dx + "px, " + dy + "px) scale(" + k + ")" }] };
      }

      // The photo flies at the gallery's size, uncropped: a transform
      // shrinks it onto the list photo, which has the same 3:2 shape, and
      // a clip crops it to that shape. The compositor moves one decoded
      // image, and nothing is laid out again.
      async function flyCover(s, before) {
        flying = true;
        const fromList = !!s;
        const start = before.getBoundingClientRect();
        const box = fromList ? coverBox() : start;

        const fly = el("img", "car-fly");
        fly.src = before.currentSrc || before.src;
        fly.alt = "";
        fly.style.visibility = "hidden";
        const veil = el("div", "car-veil");
        veil.style.opacity = fromList ? 0 : 1;
        // The colour of the page being uncovered, or of the one leaving.
        veil.style.background = fromList ? s.color : getComputedStyle(document.body).backgroundColor;
        document.body.append(veil, fly);
        await fly.decode().catch(() => {});

        const ratio = fly.naturalWidth / fly.naturalHeight;
        const width = Math.max(box.width, box.height * ratio);
        const height = width / ratio;
        const left = box.left + (box.width - width) / 2;
        const top = box.top + (box.height - height) / 2;
        Object.assign(fly.style, {
          left: left + "px",
          top: top + "px",
          width: width + "px",
          height: height + "px",
        });
        const cropped = { clipPath: "inset(" + (height - box.height) / 2 + "px " + (width - box.width) / 2 + "px)" };
        const onThumb = (rect) => ({
          transform:
            "translate(" + (rect.left - left) + "px, " + (rect.top - top) + "px) scale(" + rect.width / width + ")",
          clipPath: "inset(0px 0px)",
        });

        // Leaving a gallery, the list goes in now, under the veil, so the
        // photo and the name have a place to land.
        let target = before;
        let keyframes;
        let name;
        let targetName = null;
        let count = null;
        if (fromList) {
          keyframes = [onThumb(start), { transform: "none", ...cropped }];
          const listName = before.closest(".model").querySelector(".model-name");
          const head = headBox(s);
          name = nameFlight(listName, head.title);
          listName.style.visibility = "hidden";
          // The count slides in from the right while the photo lands.
          count = el("span", "car-fly-name", photoCount(s));
          Object.assign(count.style, head.metaStyle, { left: head.meta.left + "px", top: head.meta.top + "px" });
          document.body.appendChild(count);
        } else {
          // A stand-in for the title, which show() is about to remove.
          const title = view.querySelector(".yr-y");
          const titleRect = title.getBoundingClientRect();
          const titleStyle = getComputedStyle(title);
          const stand = el("span", null, title.textContent);
          Object.assign(stand.style, {
            position: "fixed",
            left: titleRect.left + "px",
            top: titleRect.top + "px",
            fontSize: titleStyle.fontSize,
            lineHeight: titleStyle.lineHeight,
            letterSpacing: titleStyle.letterSpacing,
            fontWeight: 500,
            color: titleStyle.color,
            visibility: "hidden",
          });
          document.body.appendChild(stand);
          show(null);
          target = view.querySelector('.model[data-i="' + series.indexOf(lastModel) + '"] img');
          keyframes = [{ transform: "none", ...cropped }, onThumb(target.getBoundingClientRect())];
          targetName = target.closest(".model").querySelector(".model-name");
          name = nameFlight(stand, targetName.getBoundingClientRect());
          stand.remove();
          targetName.style.visibility = "hidden";
        }

        const options = { duration: FLY_MS, easing: FLY_EASE, fill: "forwards" };
        const flight = fly.animate(keyframes, options);
        const nameMove = name.fly.animate(name.keyframes, options);
        if (count) {
          count.animate([{ opacity: 0, transform: "translateX(64px)" }, { opacity: 1, transform: "none" }], {
            ...options,
            duration: FLY_MS * 0.7,
            delay: FLY_MS * 0.3,
            fill: "both",
          });
        }
        const fade = veil.animate(
          [{ opacity: fromList ? 0 : 1 }, { opacity: fromList ? 1 : 0 }],
          { ...options, duration: FLY_MS * 0.6 },
        );
        fly.style.visibility = "";
        target.style.visibility = "hidden";
        await Promise.all([flight.finished, nameMove.finished, fade.finished]).catch(() => {});

        if (fromList) {
          show(s);
          view.querySelector(".yr-meta").style.animation = "none";
          await view.querySelector(".cover img").decode().catch(() => {});
          count.remove();
        } else {
          target.style.visibility = "";
          targetName.style.visibility = "";
        }
        fly.remove();
        name.fly.remove();
        veil.remove();
        flying = false;

        // A back or forward press during the flight.
        const wanted = fromURL();
        if (wanted !== current) go(wanted);
      }

      function navigate(s) {
        history.pushState({}, "", urlFor(s));
        go(s);
      }

      window.addEventListener("popstate", () => go(fromURL()));

      // --- first paint ------------------------------------------------
      const first = fromURL();
      lastModel = first;
      show(first);
      const firstPage = view.querySelector(".models, .gallery");
      firstPage.classList.add("reveal");
      // Two frames: one for layout/paint to settle, one for the browser
      // to register the pre-transition styles before we flip them.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => firstPage.classList.add("in"));
      });
    </script>
  </body>
</html>
