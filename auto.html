<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armel Kervennal — automobile</title>
    <meta
      name="description"
      content="Photographie automobile par Armel Kervennal."
    />
    <link rel="icon" type="image/png" href="Favicon/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- set synchronously so the pre-paint state matches what JS will draw -->
    <script>
      document.documentElement.className = "js";
    </script>

    <style>
      :root {
        --sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
        --ink: #111;
        --muted: rgba(17, 17, 17, 0.55);
        --line: rgba(17, 17, 17, 0.12);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --hdr-h: 72px;
        --gap: 13px;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: #fff;
      }

      body {
        font-family: var(--sans);
        font-weight: 400;
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      a {
        color: inherit;
      }

      .hdr {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 26px 32px;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.01em;
        /* no background: the soft halo vanishes on white and keeps the
           header readable when a photo scrolls underneath */
        --hdr-halo: drop-shadow(0 0 5px rgba(255, 255, 255, 0.85));
        transition: color 0.25s linear;
      }
      .hdr > a,
      .hdr > button,
      .menu {
        filter: var(--hdr-halo);
      }
      .hdr a {
        text-decoration: none;
      }
      .hdr a:hover {
        opacity: 0.55;
      }
      /* On a car's colour: no halo, and white on the dark ones. */
      .hdr.on-colour {
        --hdr-halo: none;
      }
      .hdr.on-dark {
        color: #fff;
        --hdr-halo: none;
      }
      /* White over a full-screen photo, except with the menu open: it
         then sits on the pale blur, where black reads better. */
      .hdr.on-photo:not(:has(.menu.is-open)) {
        color: #fff;
        --hdr-halo: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6))
          drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
      }

      .reveal {
        transition:
          opacity 0.7s var(--ease),
          transform 0.7s var(--ease);
      }
      .js .reveal {
        opacity: 0;
        transform: translateY(14px);
      }
      .reveal.in {
        opacity: 1;
        transform: none;
      }

      /* ============================================================
         LIST — one giant name per model; the page eases to the colour
         of whichever car is at the centre of the screen
         ============================================================ */
      .models {
        padding: 14svh var(--gap);
      }
      .model {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        min-height: 72svh;
        text-decoration: none;
        opacity: 0.3;
      }
      .model-name {
        font-size: clamp(52px, 12vw, 190px);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 0.95;
      }
      .model-cover {
        display: block;
        width: min(42vw, 620px);
        aspect-ratio: 3 / 2;
        object-fit: cover;
      }

      /* ============================================================
         GALLERY — the car's photo full-screen, then its chapters, built
         like a shoot: the whole car, the details, the action
         ============================================================ */
      .cover {
        display: block;
        height: 100svh;
        overflow: hidden;
      }
      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ser {
        --locs-gap: var(--gap);
        padding: 56px 0 14vh;
      }
      .chapter {
        margin-top: 64px;
        padding: 0 var(--gap);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .chapter + .grid {
        padding-top: 14px;
      }
      .grid + .grid {
        margin-top: 64px;
      }

      /* Cascade version of the album grid: photos keep their own ratio
         (--r) and stack in columns, each going to the shortest one. */
      .grid.organic {
        --grid-gap: 13px;
        display: flex;
        align-items: flex-start;
      }
      .organic-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--grid-gap);
      }
      .organic .grid-idx {
        display: none;
      }
      .organic button {
        width: 100%;
      }
      .organic .grid-thumb {
        height: auto;
        aspect-ratio: var(--r);
      }
      .organic .grid-thumb img {
        width: 100%;
      }

      @media (max-width: 700px) {
        :root {
          --hdr-h: 58px;
        }
        .hdr {
          padding: 20px 20px;
          font-size: 15px;
        }
        .model {
          min-height: 64svh;
          gap: 18px;
        }
        .model-cover {
          width: 100%;
        }
        /* Phones: the list photo grows to the screen's width and settles
           at mid-height, with the gallery showing underneath it. 33.33vw
           is half the height of a 3:2 photo at full width. */
        .cover {
          height: auto;
          padding-top: calc(50svh - 33.33vw);
        }
        .cover img {
          height: auto;
          aspect-ratio: 3 / 2;
        }
        .ser {
          padding-top: 24px;
        }
        .chapter {
          margin-top: 44px;
        }
        .grid + .grid {
          margin-top: 40px;
        }
        .grid.organic {
          --grid-gap: 12px;
        }
      }

      @view-transition {
        navigation: auto;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.5s;
        animation-timing-function: var(--ease);
      }
      /* The list photo growing into the gallery's full-screen one. */
      ::view-transition-group(car-cover) {
        animation-duration: 0.8s;
        animation-timing-function: var(--ease);
      }
      ::view-transition-old(car-cover),
      ::view-transition-new(car-cover) {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      @media (prefers-reduced-motion: reduce) {
        .hdr,
        .reveal {
          transition: none;
        }
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
      }
    </style>
    <link rel="stylesheet" href="menu.css" />
    <link rel="stylesheet" href="gallery.css" />
  </head>

  <body>
    <header class="hdr" id="hdr">
      <a href="index.html">Armel Kervennal</a>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
      <nav class="menu" id="menu" hidden>
        <a href="archive.html">archive</a>
        <a href="auto.html" class="is-current">automobile</a>
        <a href="about.html">about</a>
      </nav>
    </header>
    <div class="menu-scrim" id="menuScrim" hidden></div>

    <main id="view"></main>

    <div class="lb" id="lb">
      <button class="lb-close" id="lbClose">fermer · esc</button>
      <button class="lb-nav prev" id="lbPrev" aria-label="Photo précédente"></button>
      <div class="lb-stage" id="lbStage"></div>
      <button class="lb-nav next" id="lbNext" aria-label="Photo suivante"></button>
      <div class="lb-counter" id="lbCounter"></div>
    </div>

    <script src="site-config.js"></script>
    <script src="menu.js"></script>
    <script src="gallery.js"></script>
    <script src="colour.js"></script>
    <script>
      const series = ((window.SITE_CONFIG && SITE_CONFIG.auto) || {}).series || [];
      const hdr = document.getElementById("hdr");
      const view = document.getElementById("view");
      const phone = matchMedia("(max-width: 700px)");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

      // We put the scroll back ourselves when returning to the list.
      history.scrollRestoration = "manual";

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function slug(model) {
        return model
          .normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-");
      }

      function fromURL() {
        const m = new URLSearchParams(location.search).get("m");
        return series.find((s) => slug(s.model) === m) || null;
      }

      function urlFor(s) {
        return s ? "auto.html?m=" + slug(s.model) : "auto.html";
      }

      function setPage(bg, ink) {
        document.documentElement.style.backgroundColor = bg;
        document.body.style.backgroundColor = bg;
        document.body.style.color = ink;
      }

      // --- list -------------------------------------------------------
      let current = null; // the model on screen, null on the list
      let activeRow = null;
      let listY = 0;

      let rows = [];

      const centreLine = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting || current) return;
            activateRow(entry.target);
          });
        },
        { rootMargin: "-50% 0px -50% 0px" },
      );

      // Same treatment as the homepage (see the scroll loop in index.html):
      // the row at the centre sets a target, and the colour and the rows'
      // opacity ease toward it, in OKLab, at their own pace.
      const EASE = 0.085; // per-frame lerp factor, ~600ms to settle at 60fps
      const SETTLED = 0.0015; // below this distance-to-target, snap and stop
      const ROW_REST = 0.3;
      let curLab = null;
      let targetLab = null;
      let painting = false;

      function paintList() {
        painting = false;
        if (current || !targetLab) return;
        const ease = reduceMotion.matches ? 1 : EASE;
        let settling = false;

        if (!curLab) {
          curLab = targetLab;
        } else {
          let rest = 0;
          curLab = curLab.map((v, k) => {
            const nv = v + (targetLab[k] - v) * ease;
            rest = Math.max(rest, Math.abs(targetLab[k] - nv));
            return nv;
          });
          if (rest < SETTLED) curLab = targetLab;
          else settling = true;
        }

        rows.forEach((row) => {
          const target = row === activeRow ? 1 : ROW_REST;
          let op = row.opacity + (target - row.opacity) * ease;
          if (Math.abs(target - op) < SETTLED) op = target;
          else settling = true;
          row.opacity = op;
          row.el.style.opacity = op;
        });

        const dark = curLab[0] < 0.62;
        setPage(oklabToCss(curLab), dark ? "#f2f2f2" : "#111111");
        hdr.classList.toggle("on-colour", !dark);
        hdr.classList.toggle("on-dark", dark);

        if (settling && !painting) {
          painting = true;
          requestAnimationFrame(paintList);
        }
      }

      function activateRow(rowEl) {
        activeRow = rows.find((row) => row.el === rowEl);
        targetLab = hexToOklab(series[+rowEl.dataset.i].color);
        if (!painting) {
          painting = true;
          requestAnimationFrame(paintList);
        }
      }

      // Back from a gallery or on first load: no easing in, the page is
      // simply already on the row at the centre of the screen.
      function snapToCentre() {
        const middle = window.innerHeight / 2;
        const row =
          rows.find(({ el }) => {
            const r = el.getBoundingClientRect();
            return r.top <= middle && r.bottom > middle;
          }) || rows[0];
        activeRow = row;
        targetLab = hexToOklab(series[+row.el.dataset.i].color);
        curLab = targetLab;
        rows.forEach((r) => {
          r.opacity = r === row ? 1 : ROW_REST;
        });
        paintList();
      }

      function renderList() {
        const nav = el("nav", "models");
        rows = [];
        series.forEach((s, i) => {
          const a = el("a", "model");
          a.href = urlFor(s);
          a.dataset.i = i;
          a.appendChild(el("span", "model-name", s.model));
          const img = el("img", "model-cover");
          img.src = s.cover;
          img.alt = s.model;
          a.appendChild(img);
          a.addEventListener("click", (e) => {
            e.preventDefault();
            navigate(s);
          });
          nav.appendChild(a);
          rows.push({ el: a, opacity: ROW_REST });
          centreLine.observe(a);
        });
        view.replaceChildren(nav);
        hdr.classList.remove("on-photo");
      }

      // --- gallery ----------------------------------------------------
      let cascades = [];

      function layoutCascade({ grid, cells, ratios }) {
        const cols = Array.from({ length: phone.matches ? 2 : 3 }, () => el("div", "organic-col"));
        const heights = cols.map(() => 0);
        cells.forEach((cell, i) => {
          const k = heights.indexOf(Math.min(...heights));
          cols[k].appendChild(cell);
          heights[k] += 1 / ratios[i];
        });
        grid.replaceChildren(...cols);
      }

      phone.addEventListener("change", () => {
        cascades.forEach(layoutCascade);
        photoTone();
      });

      function buildCover(s) {
        const cover = el("div", "cover");
        const img = document.createElement("img");
        img.src = s.cover;
        img.alt = s.model;
        cover.appendChild(img);
        return cover;
      }

      function renderGallery(s) {
        const all = s.groups.flatMap((g) => g.photos.map((p) => p.src));
        const wrap = el("div");
        wrap.appendChild(buildCover(s));

        const sec = el("section", "ser");
        const head = el("a", "yr-head");
        head.href = urlFor(null);
        head.append(el("span", "yr-y", s.model), el("span", "yr-meta", String(all.length)));
        head.addEventListener("click", (e) => {
          e.preventDefault();
          navigate(null);
        });
        sec.appendChild(head);

        cascades = [];
        let offset = 0;
        s.groups.forEach((group) => {
          if (group.label) sec.appendChild(el("h3", "chapter", group.label));
          const grid = buildPhotoGrid(group.photos.map((p) => p.src), s.model, all, offset);
          grid.classList.add("organic");
          const cells = [...grid.children];
          const ratios = group.photos.map((p) => p.w / p.h);
          cells.forEach((cell, i) => cell.style.setProperty("--r", ratios[i].toFixed(3)));
          const cascade = { grid, cells, ratios };
          cascades.push(cascade);
          layoutCascade(cascade);
          sec.appendChild(grid);
          offset += group.photos.length;
        });

        wrap.appendChild(sec);
        view.replaceChildren(wrap);
        setPage("#fff", "#111");
        hdr.classList.remove("on-colour", "on-dark");
      }

      // White header while the full-screen photo is behind it; on phones
      // the photo sits lower, with the page's white behind the header.
      function photoTone() {
        const cover = view.querySelector(".cover");
        const over =
          current &&
          cover &&
          !phone.matches &&
          window.pageYOffset < cover.offsetHeight - hdr.offsetHeight;
        hdr.classList.toggle("on-photo", !!over);
      }
      window.addEventListener("scroll", photoTone, { passive: true });

      // --- routing ----------------------------------------------------
      function coverOf(s) {
        if (s) return view.querySelector(".cover img");
        return activeRow && activeRow.el.querySelector(".model-cover");
      }

      function show(s) {
        current = s;
        if (s) {
          renderGallery(s);
          window.scrollTo(0, 0);
        } else {
          renderList();
          window.scrollTo(0, listY);
          snapToCentre();
        }
        photoTone();
      }

      // The photo of the car being opened (or left) grows into the other
      // view's: same view-transition-name on both sides of the swap.
      function go(s) {
        if (s === current) return;
        if (!current) listY = window.pageYOffset;

        if (!document.startViewTransition || reduceMotion.matches) {
          show(s);
          return;
        }

        const row = s ? view.querySelector('.model[data-i="' + series.indexOf(s) + '"] img') : null;
        const before = row || coverOf(current);
        const visible = before && before.getBoundingClientRect().bottom > 0;
        if (visible) before.style.viewTransitionName = "car-cover";

        let after = null;
        const transition = document.startViewTransition(() => {
          if (before) before.style.viewTransitionName = "";
          show(s);
          after = s ? coverOf(s) : view.querySelector('.model[data-i="' + series.indexOf(lastModel) + '"] img');
          if (visible && after) after.style.viewTransitionName = "car-cover";
        });
        lastModel = s || lastModel;
        transition.updateCallbackDone.catch(() => {});
        transition.ready.catch(() => {});
        transition.finished.catch(() => {}).finally(() => {
          if (after) after.style.viewTransitionName = "";
        });
      }

      let lastModel = null;

      function navigate(s) {
        history.pushState({}, "", urlFor(s));
        go(s);
      }

      window.addEventListener("popstate", () => go(fromURL()));

      // --- first paint ------------------------------------------------
      const first = fromURL();
      lastModel = first;
      show(first);
      view.firstElementChild.classList.add("reveal");
      // Two frames: one for layout/paint to settle, one for the browser
      // to register the pre-transition styles before we flip them.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => view.firstElementChild.classList.add("in"));
      });
    </script>
  </body>
</html>
